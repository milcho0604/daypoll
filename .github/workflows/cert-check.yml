name: Certificate expiry check

# 매일 점심 무렵에 TLS / Tailscale auth key 만료일 점검.
#
# 두 가지 이슈를 유지한다:
#  1) 현황 이슈 (label: cert-status) — 항상 1개 열어두고 매일 만료일·D-day 를 갱신.
#     "우리 인증서 언제 만료되지?" 를 이슈 하나 열어 바로 볼 수 있게. 닫지 않는다.
#  2) 알림 이슈 (label: auto-alert) — 30일 이내면 생성/갱신, 7일 이내면 더 강한 메시지.
#     조치 후 사람이 close 하거나, 모두 30일 이상으로 돌아오면 자동 close.
#
# 사용자가 캘린더에 직접 메모할 필요 없음 — 시스템이 알아서 알려준다.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 11:00 KST 매일
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      # TS_AUTHKEY 는 deploy.yml 의 ssh 우회(ephemeral Tailnet 노드) 용으로만 유지.
      TS_AUTHKEY_EXPIRY: '2026-12-05'
      # api: Cloudflare Universal SSL 자동 갱신 (Google Trust Services 발급).
      # web: Vercel 이 Let's Encrypt 로 자동 갱신. 둘 다 손볼 일은 없지만
      # 갱신이 멈추면 그날로 서비스가 죽으니 만료일을 같이 본다.
      BACKEND_HOST: 'api.moilga.com'
      # web 은 호스트마다 인증서가 따로다. apex 하나만 보다가 www 인증서가 만료된
      # 채로 2주를 방치한 적이 있다 (2026-09-06 만료 → 09-20 발견). 공백으로 구분해
      # 여기에 추가하면 현황 표와 알림에 자동으로 따라온다.
      WEB_HOSTS: 'moilga.com www.moilga.com milcho.moilga.com'

    steps:
      - name: Check TLS certificate (api)
        id: tls
        env:
          HOST: ${{ env.BACKEND_HOST }}
        run: |
          EXPIRY=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          EXPIRY_ISO=$(date -d "$EXPIRY" -u +%Y-%m-%d)
          DAYS=$(( ($(date -d "$EXPIRY" +%s) - $(date +%s)) / 86400 ))
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "expiry=$EXPIRY_ISO" >> "$GITHUB_OUTPUT"
          echo "$HOST TLS expires $EXPIRY_ISO — D-$DAYS"

      - name: Check TLS certificates (web)
        id: web
        env:
          HOSTS: ${{ env.WEB_HOSTS }}
        run: |
          RESULTS='[]'
          MIN=99999
          for HOST in $HOSTS; do
            EXPIRY=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null \
              | openssl x509 -noout -enddate | cut -d= -f2)
            if [ -z "$EXPIRY" ]; then
              # 인증서를 아예 못 읽으면 (연결 실패·핸드셰이크 거부) 조용히 넘기지 않는다.
              EXPIRY_ISO='읽기 실패'
              DAYS=0
            else
              EXPIRY_ISO=$(date -d "$EXPIRY" -u +%Y-%m-%d)
              DAYS=$(( ($(date -d "$EXPIRY" +%s) - $(date +%s)) / 86400 ))
            fi
            if [ "$DAYS" -lt "$MIN" ]; then MIN=$DAYS; fi
            RESULTS=$(printf '%s' "$RESULTS" | jq -c --arg h "$HOST" --arg e "$EXPIRY_ISO" --argjson d "$DAYS" '. + [{host: $h, expiry: $e, days: $d}]')
            echo "$HOST TLS expires $EXPIRY_ISO — D-$DAYS"
          done
          echo "hosts=$RESULTS" >> "$GITHUB_OUTPUT"
          echo "min_days=$MIN" >> "$GITHUB_OUTPUT"

      - name: Check Tailscale auth key
        id: ts
        run: |
          DAYS=$(( ($(date -d "$TS_AUTHKEY_EXPIRY" +%s) - $(date +%s)) / 86400 ))
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "expiry=$TS_AUTHKEY_EXPIRY" >> "$GITHUB_OUTPUT"
          echo "TS_AUTHKEY expires $TS_AUTHKEY_EXPIRY — D-$DAYS"

      # 항상 실행 — 만료 여부와 무관하게 "지금 언제 만료되는지" 를 이슈 한 곳에 남긴다.
      - name: Upsert status issue
        uses: actions/github-script@v7
        env:
          TLS_DAYS: ${{ steps.tls.outputs.days }}
          TLS_EXPIRY: ${{ steps.tls.outputs.expiry }}
          WEB_HOSTS_JSON: ${{ steps.web.outputs.hosts }}
          TS_DAYS: ${{ steps.ts.outputs.days }}
          TS_EXPIRY: ${{ steps.ts.outputs.expiry }}
        with:
          script: |
            const webHosts = JSON.parse(process.env.WEB_HOSTS_JSON);
            const rows = [
              { name: `TLS \`${process.env.BACKEND_HOST}\``, expiry: process.env.TLS_EXPIRY, days: parseInt(process.env.TLS_DAYS, 10), how: 'Cloudflare Universal SSL 자동 갱신' },
              ...webHosts.map((h) => ({ name: `TLS \`${h.host}\``, expiry: h.expiry, days: h.days, how: 'Vercel(Let\'s Encrypt) 자동 갱신' })),
              { name: 'TS_AUTHKEY (deploy)', expiry: process.env.TS_EXPIRY, days: parseInt(process.env.TS_DAYS, 10), how: '수동 — Tailscale 새 키 발급 → `gh secret set TS_AUTHKEY` → `cert-check.yml` 의 `TS_AUTHKEY_EXPIRY` 갱신' },
            ];
            const light = (d) => (d < 7 ? '🔴' : d < 30 ? '🟡' : '🟢');
            // 이미 만료된 건 D--13 처럼 깨져 보이면 안 된다 — 제일 급한 줄이다.
            const dday = (d) => (d < 0 ? `만료됨 (${-d}일 지남)` : `D-${d}`);
            const kst = new Date(Date.now() + 9 * 3600 * 1000).toISOString().replace('T', ' ').slice(0, 16);

            const body = [
              '## 인증서 / 키 만료 현황',
              '',
              '| 항목 | 만료일 | 남은 날 | 갱신 방법 |',
              '|---|---|---|---|',
              ...rows.map((r) => `| ${r.name} | ${r.expiry} | ${light(r.days)} ${dday(r.days)} | ${r.how} |`),
              '',
              '🟢 30일 이상 · 🟡 30일 이내 · 🔴 7일 이내',
              '',
              `> 매일 11:00 KST \`cert-check.yml\` 이 이 이슈를 갱신해요 (마지막 점검 ${kst} KST).`,
              '> 30일 이내로 들어오면 별도 \`auto-alert\` 이슈가 열리고 GitHub 알림이 가요.',
              '> **이 이슈는 닫지 마세요** — 닫으면 다음 점검 때 새로 만들어져요.',
            ].join('\n');
            const title = '📋 인증서/키 만료 현황';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'cert-status',
              state: 'open',
            });
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
              console.log(`Updated status issue #${issues[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cert-status'],
              });
              console.log(`Created status issue #${created.data.number}`);
            }

      - name: Open or update alert issue
        if: steps.tls.outputs.days < 30 || steps.web.outputs.min_days < 30 || steps.ts.outputs.days < 30
        uses: actions/github-script@v7
        env:
          TLS_DAYS: ${{ steps.tls.outputs.days }}
          TLS_EXPIRY: ${{ steps.tls.outputs.expiry }}
          WEB_HOSTS_JSON: ${{ steps.web.outputs.hosts }}
          TS_DAYS: ${{ steps.ts.outputs.days }}
          TS_EXPIRY: ${{ steps.ts.outputs.expiry }}
        with:
          script: |
            const tlsDays = parseInt(process.env.TLS_DAYS, 10);
            const webHosts = JSON.parse(process.env.WEB_HOSTS_JSON);
            const tsDays = parseInt(process.env.TS_DAYS, 10);
            const urgent = tlsDays < 7 || webHosts.some((h) => h.days < 7) || tsDays < 7;
            const dday = (d) => (d < 0 ? `만료됨 (${-d}일 지남)` : `D-${d}`);

            const lines = [];
            if (tlsDays < 30) {
              lines.push(`- ${tlsDays < 7 ? '🔴' : '🟡'} **TLS 인증서 (${process.env.BACKEND_HOST})**: ${dday(tlsDays)} · 만료일 ${process.env.TLS_EXPIRY}. Cloudflare Universal SSL 이 자동 갱신하지만 그 즈음 \`curl https://${process.env.BACKEND_HOST}/health\` 한 번. 안 갱신되면 Cloudflare 대시보드 → SSL/TLS → Edge Certificates 확인.`);
            }
            for (const h of webHosts.filter((h) => h.days < 30)) {
              lines.push(`- ${h.days < 7 ? '🔴' : '🟡'} **TLS 인증서 (${h.host})**: ${dday(h.days)} · 만료일 ${h.expiry}. Vercel 이 Let's Encrypt 로 자동 갱신. 안 갱신되면 Vercel 대시보드 → 프로젝트 moilga → Settings → Domains 에 **그 호스트가 등록돼 있는지** 부터 확인 (등록 안 된 서브도메인은 갱신 대상이 아니라 만료된 옛 인증서가 그대로 나간다). DNS 가 Cloudflare 를 거치면 프록시(주황 구름) 가 꺼져 있어야 갱신됨.`);
            }
            if (tsDays < 30) {
              lines.push(`- ${tsDays < 7 ? '🔴' : '🟡'} **TS_AUTHKEY**: ${dday(tsDays)} · 만료일 ${process.env.TS_EXPIRY}. https://login.tailscale.com/admin/settings/keys 새 키 발급 (Reusable + Ephemeral) → \`printf '%s' '<KEY>' | gh secret set TS_AUTHKEY -R milcho0604/daypoll\` → \`cert-check.yml\` 의 \`TS_AUTHKEY_EXPIRY\` 도 새 날짜로.`);
            }

            const title = urgent ? '🔴 인증서/키 만료 임박 (D-7 이내)' : '🟡 인증서/키 만료 임박 (D-30 이내)';
            const body = [
              '## 만료 임박',
              '',
              ...lines,
              '',
              urgent ? '⚠️ **즉시 조치 필요**' : '여유 있을 때 처리.',
              '',
              `> 자동 갱신: 매일 11:00 KST cron 으로 \`.github/workflows/cert-check.yml\` 이 갱신. 조치 후 이 이슈를 close 하세요.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'auto-alert',
              state: 'open',
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
              console.log(`Updated issue #${issues[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['auto-alert'],
              });
              console.log(`Created issue #${created.data.number}`);
            }

      - name: Close alert if everything is healthy
        if: steps.tls.outputs.days >= 30 && steps.web.outputs.min_days >= 30 && steps.ts.outputs.days >= 30
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'auto-alert',
              state: 'open',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ 다음 cron 점검에서 모든 항목이 30일 이상 남음. 자동 close.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
