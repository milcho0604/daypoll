<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모일까 컷툰 EP.1</title>
<style>
  @font-face { font-family: Pretendard; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 600; src: url(fonts/Pretendard-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format('woff2'); }
  html, body { margin: 0; background: #d4d4d8; }
  body { display: flex; flex-direction: column; gap: 40px; padding: 40px; align-items: flex-start; }
  svg.slide { display: block; width: 1080px; height: 1350px; flex: none; }
  svg text { font-family: Pretendard, sans-serif; }
</style>
</head>
<body>
<script>
// =====================================================================
// 모일까 컷툰 EP.1 — 8장 (1080×1350). 렌더: node render.mjs
// 브랜드: zinc 베이스 + amber 는 1위/확정 순간에만, 단색. 그라데이션·🏆 금지.
// =====================================================================
const C = {
  ink: '#18181b', z700: '#3f3f46', z500: '#71717a', z400: '#a1a1aa', z300: '#d4d4d8', z200: '#e4e4e7', z100: '#f4f4f5', z50: '#fafafa',
  bg: '#fafaf9', white: '#ffffff',
  // amber — 1위/확정 한정
  a500: '#f59e0b', a300: '#fcd34d', a200: '#fde68a', a50: '#fffbeb', a700: '#b45309',
  rose500: '#f43f5e',
  // 캐릭터 색 (털)
  cF: '#b8643c', cCurl: '#8a4526', cMz: '#d48a5c', tongue: '#f59aaa', blush: '#f5a3a3',
  mF: '#ffffff', mCap: '#a1a1aa', mCap2: '#85858f', iris: '#c5d465', earIn: '#f6c3cc', mNose: '#f29fb0',
  kong: '#e7e5e4', dubu: '#ffffff',
};
const SW = 5;
let UID = 0;
const W = 1080, H = 1350, M = 72;

// ---------- 헬퍼 ----------
const circ = (a) => a.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
const ell = (a) => a.map(([x, y, rx, ry, rot = 0]) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})"/>`).join('');
// 도형 합집합에 바깥 외곽선만 — 겹친 원들이 한 덩어리 털처럼 보인다
const blob = (shapes, fill, sw = SW) =>
  `<g><g fill="${C.ink}" stroke="${C.ink}" stroke-width="${sw * 2}" stroke-linejoin="round">${shapes}</g><g fill="${fill}">${shapes}</g></g>`;
const curl = (x, y, r = 9, rot = 0, col = C.cCurl, w = 4) =>
  `<path d="M${x - r} ${y} a${r} ${r} 0 1 1 ${r * 1.5} ${r * 0.7}" transform="rotate(${rot} ${x} ${y})" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
const place = (x, y, s, inner, flip = false) => `<g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})">${inner}</g>`;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

const cvs = document.createElement('canvas').getContext('2d');
function tw(str, size, weight = 700) { cvs.font = `${weight} ${size}px Pretendard`; return cvs.measureText(str).width; }
function T(x, y, str, { size = 40, weight = 700, fill = C.ink, anchor = 'start', ls = 0, extra = '' } = {}) {
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" ${ls ? `letter-spacing="${ls}"` : ''} ${extra}>${esc(str)}</text>`;
}

// 말풍선: 흰 바탕 + zinc-900 외곽선, 꼬리 하나 (아래/위/좌/우 자동)
function bubblePath(x, y, w, h, r, t) {
  const bw = 36;
  if (!t) return `M${x + r} ${y} H${x + w - r} A${r} ${r} 0 0 1 ${x + w} ${y + r} V${y + h - r} A${r} ${r} 0 0 1 ${x + w - r} ${y + h} H${x + r} A${r} ${r} 0 0 1 ${x} ${y + h - r} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  if (t.y > y + h) {
    const bx = cl(t.x, x + r + bw / 2 + 4, x + w - r - bw / 2 - 4);
    return `M${x + r} ${y} H${x + w - r} A${r} ${r} 0 0 1 ${x + w} ${y + r} V${y + h - r} A${r} ${r} 0 0 1 ${x + w - r} ${y + h} H${bx + bw / 2} L${t.x} ${t.y} L${bx - bw / 2} ${y + h} H${x + r} A${r} ${r} 0 0 1 ${x} ${y + h - r} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  }
  if (t.y < y) {
    const bx = cl(t.x, x + r + bw / 2 + 4, x + w - r - bw / 2 - 4);
    return `M${x + r} ${y} H${bx - bw / 2} L${t.x} ${t.y} L${bx + bw / 2} ${y} H${x + w - r} A${r} ${r} 0 0 1 ${x + w} ${y + r} V${y + h - r} A${r} ${r} 0 0 1 ${x + w - r} ${y + h} H${x + r} A${r} ${r} 0 0 1 ${x} ${y + h - r} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  }
  const by = cl(t.y, y + r + bw / 2, y + h - r - bw / 2);
  if (t.x < x) return `M${x + r} ${y} H${x + w - r} A${r} ${r} 0 0 1 ${x + w} ${y + r} V${y + h - r} A${r} ${r} 0 0 1 ${x + w - r} ${y + h} H${x + r} A${r} ${r} 0 0 1 ${x} ${y + h - r} V${by + bw / 2} L${t.x} ${t.y} L${x} ${by - bw / 2} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  return `M${x + r} ${y} H${x + w - r} A${r} ${r} 0 0 1 ${x + w} ${y + r} V${by - bw / 2} L${t.x} ${t.y} L${x + w} ${by + bw / 2} V${y + h - r} A${r} ${r} 0 0 1 ${x + w - r} ${y + h} H${x + r} A${r} ${r} 0 0 1 ${x} ${y + h - r} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
}
// cx = 가운데 x, y = 위쪽 y
function bubble(cx, y, lines, tail, { size = 44, weight = 700, padX = 34, padY = 24, fill = C.white, color = C.ink, sw = 4.5 } = {}) {
  const lh = size * 1.32;
  const w = Math.max(...lines.map((l) => tw(l, size, weight))) + padX * 2;
  const h = lines.length * lh + padY * 2 - (lh - size) + 4;
  const x = cx - w / 2;
  const r = Math.min(40, h / 2);
  let s = `<path d="${bubblePath(x, y, w, h, r, tail)}" fill="${fill}" stroke="${C.ink}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  lines.forEach((l, i) => { s += T(cx, y + padY + size * 0.86 + i * lh + 2, l, { size, weight, fill: color, anchor: 'middle' }); });
  return s;
}

// ---------- 작은 소품 ----------
const sweat = (x, y, s = 1) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -22 Q14 -2 12 8 A12 12 0 0 1 -12 8 Q-14 -2 0 -22Z" fill="${C.white}" stroke="${C.ink}" stroke-width="${4 / s}" stroke-linejoin="round"/>`;
const sparkle = (x, y, s, fill = C.white) => `<path d="M${x} ${y - s} Q${x + s * .18} ${y - s * .18} ${x + s} ${y} Q${x + s * .18} ${y + s * .18} ${x} ${y + s} Q${x - s * .18} ${y + s * .18} ${x - s} ${y} Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z" fill="${fill}" stroke="${C.ink}" stroke-width="3.5" stroke-linejoin="round"/>`;
const ticks = (x, y, n = 3, len = 22, spread = 70, rot = 0, r0 = 0) => {
  let s = `<g transform="rotate(${rot} ${x} ${y})">`;
  for (let i = 0; i < n; i++) { const a = (-spread / 2 + (spread / (n - 1)) * i - 90) * Math.PI / 180; s += `<path d="M${x + Math.cos(a) * r0} ${y + Math.sin(a) * r0} l${Math.cos(a) * len} ${Math.sin(a) * len}" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`; }
  return s + '</g>';
};
// 단색 왕관 (components/icons/crown.tsx 와 같은 path, 24 박스)
const crown = (cx, cy, size, color = C.white, sw = 2.2) =>
  `<g transform="translate(${cx - size / 2} ${cy - size / 2}) scale(${size / 24})" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5 3 6.8l4.7 3.4L12 4.5l4.3 5.7L21 6.8l-1 10.7z"/><path d="M4.4 20.2h15.2"/></g>`;
// 모일까 마크 — zinc-900 둥근 사각 + "모"
const mark = (x, y, s) => `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s * 0.28}" fill="${C.ink}"/>` + T(x + s / 2, y + s * 0.72, '모', { size: s * 0.58, weight: 800, fill: C.white, anchor: 'middle' });
// 작은 캘린더 아이콘 (이모지 대신)
const calIcon = (x, y, s, stroke = C.ink, fill = C.white) =>
  `<g transform="translate(${x} ${y}) scale(${s / 24})" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5" fill="${fill}"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="${stroke}" stroke="none"/></g>`;

// =====================================================================
// 초코 — 레드브라운 토이푸들
// =====================================================================
function chocoHead(o = {}) {
  const eyes = o.eyes ?? 'open', mouth = o.mouth ?? 'tongue';
  let s = '';
  // 귀 (축 늘어진 곱슬)
  for (const sd of [-1, 1]) {
    s += blob(circ([[sd * 92, -14, 32], [sd * 104, 24, 33], [sd * 104, 62, 30], [sd * 94, 92, 24]]), C.cF);
    s += curl(sd * 102, 22, 9, sd * 20) + curl(sd * 100, 64, 8, sd * -30);
  }
  // 머리 + 곱슬 톱노트
  s += blob(`<ellipse cx="0" cy="8" rx="98" ry="88"/>` + circ([[-58, -58, 34], [-20, -84, 37], [22, -86, 37], [60, -58, 34], [-84, -16, 24], [84, -16, 24], [-78, 46, 26], [78, 46, 26], [-40, 80, 28], [0, 88, 30], [40, 80, 28]]), C.cF);
  s += curl(-34, -78, 10, 10) + curl(22, -88, 10, 50) + curl(-70, -36, 8, 80);
  // 주둥이 (외곽선 없이 밝은 털로만)
  s += `<ellipse cx="0" cy="50" rx="40" ry="30" fill="${C.cMz}"/>`;
  // 볼터치
  s += `<ellipse cx="-66" cy="40" rx="16" ry="9" fill="${C.blush}" opacity="${o.blush ? .95 : .6}"/><ellipse cx="66" cy="40" rx="16" ry="9" fill="${C.blush}" opacity="${o.blush ? .95 : .6}"/>`;
  // 눈
  const ex = 38, ey = 6, lk = o.look ?? 0;
  if (eyes === 'open' || eyes === 'sparkle') {
    const big = eyes === 'sparkle';
    const e = (x) => `<ellipse cx="${x + lk}" cy="${ey}" rx="${big ? 17 : 15}" ry="${big ? 20 : 18}" fill="${C.ink}"/><circle cx="${x + lk - 5}" cy="${ey - 7}" r="${big ? 7 : 5.5}" fill="#fff"/><circle cx="${x + lk + 6}" cy="${ey + 7}" r="${big ? 3.5 : 2.5}" fill="#fff"/>`;
    s += e(-ex) + e(ex);
  } else if (eyes === 'happy') {
    s += `<path d="M${-ex - 15} ${ey + 7} Q${-ex} ${ey - 16} ${-ex + 15} ${ey + 7} M${ex - 15} ${ey + 7} Q${ex} ${ey - 16} ${ex + 15} ${ey + 7}" fill="none" stroke="${C.ink}" stroke-width="6.5" stroke-linecap="round"/>`;
  } else if (eyes === 'dizzy') {
    const sp = (x) => `<path d="M${x} ${ey} m-2 0 a4 4 0 1 1 6 3 a8 8 0 1 1 -12 -8 a12 12 0 1 1 18 14" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
    s += sp(-ex) + sp(ex);
  } else if (eyes === 'blank') {
    s += `<circle cx="${-ex + lk}" cy="${ey}" r="6.5" fill="${C.ink}"/><circle cx="${ex + lk}" cy="${ey}" r="6.5" fill="${C.ink}"/>`;
  } else if (eyes === 'closed') {
    s += `<path d="M${-ex - 15} ${ey} Q${-ex} ${ey + 12} ${-ex + 15} ${ey} M${ex - 15} ${ey} Q${ex} ${ey + 12} ${ex + 15} ${ey}" fill="none" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
  }
  // 코
  s += `<path d="M-14 30 Q0 24 14 30 Q12 44 0 46 Q-12 44 -14 30Z" fill="${C.ink}"/><ellipse cx="-5" cy="31" rx="4" ry="2.5" fill="#fff" opacity=".7"/>`;
  // 입
  const w = `<path d="M-16 54 Q-8 62 0 54 Q8 62 16 54" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
  if (mouth === 'tongue') s += w + `<path d="M-7 58 Q-9 82 2 82 Q12 81 8 58Z" fill="${C.tongue}" stroke="${C.ink}" stroke-width="3.5" stroke-linejoin="round"/>`;
  else if (mouth === 'grin') s += `<path d="M-20 54 Q0 92 20 54 Z" fill="#5b2a22" stroke="${C.ink}" stroke-width="4" stroke-linejoin="round"/><path d="M-10 68 Q0 60 10 68 Q8 80 0 80 Q-8 80 -10 68Z" fill="${C.tongue}"/>`;
  else if (mouth === 'o') s += `<ellipse cx="0" cy="64" rx="9" ry="11" fill="#5b2a22" stroke="${C.ink}" stroke-width="3.5"/>`;
  else if (mouth === 'wavy') s += `<path d="M-20 62 q5 -6 10 0 t10 0 t10 0 t10 0" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
  else if (mouth === 'flat') s += `<path d="M-10 60 H10" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
  else s += w;
  return s;
}
const pom = (x, y, fill = C.cF) => blob(circ([[x, y, 19], [x - 12, y - 8, 12], [x + 12, y - 8, 12]]), fill);
function arm(sx, sy, ang, len, fill, pomFill) {
  return `<g transform="translate(${sx} ${sy}) rotate(${ang})">${blob(`<rect x="-15" y="${-len}" width="30" height="${len + 10}" rx="15"/>`, fill)}${pom(0, -len, pomFill ?? fill)}</g>`;
}
// pose: stand | cheer | point | phone | sit
function choco(pose = 'stand', o = {}) {
  let s = '';
  // 꼬리 방울
  s += blob(circ([[66, -100, 20], [54, -114, 14], [78, -114, 14]]), C.cF);
  // 뒷발 + 몸
  s += blob(ell([[-30, -12, 26, 15], [30, -12, 26, 15]]), C.cF);
  s += blob(`<ellipse cx="0" cy="-84" rx="62" ry="66"/>`, C.cF);
  s += curl(-18, -70, 8, 30) + curl(16, -96, 8, -40) + curl(10, -52, 7, 60);
  let over = '';
  const down = (sd) => arm(sd * 46, -104, sd * 165, 50, C.cF);
  if (pose === 'cheer') over = arm(-56, -118, -42, 172, C.cF) + arm(56, -118, 42, 172, C.cF);
  else if (pose === 'point') { s += down(-1); over = arm(50, -112, 66, 104, C.cF); }
  else if (pose === 'wave') { s += down(-1); over = arm(50, -116, 40, 128, C.cF); }
  else if (pose === 'phone') {
    s += `<rect x="-36" y="-136" width="72" height="100" rx="14" fill="${C.white}" stroke="${C.ink}" stroke-width="5"/><rect x="-12" y="-126" width="24" height="5" rx="2.5" fill="${C.ink}"/>`;
    s += pom(-38, -66) + pom(38, -66);
  } else s += down(-1) + down(1);
  s += `<g transform="translate(0 -232)${o.tilt ? ` rotate(${o.tilt})` : ''}">${chocoHead(o)}</g>`;
  return s + over;
}
// 머리만 + 앞발 두 개로 모서리를 잡고 빼꼼
function chocoPeek(o = {}) {
  return `<g transform="translate(0 -110)${o.tilt ? ` rotate(${o.tilt})` : ''}">${chocoHead(o)}</g>` + pom(-52, -6) + pom(52, -6);
}

// =====================================================================
// 밀크 — 흰 장모 고양이, 머리 위 회색 모자 무늬, 새침한 연두눈
// =====================================================================
function milkHead(o = {}) {
  const eyes = o.eyes ?? 'smug', mouth = o.mouth ?? 'w';
  const id = 'mh' + (UID++);
  let s = '';
  for (const sd of [-1, 1]) {
    s += `<path d="M${sd * 106} -24 L${sd * 100} -132 Q${sd * 94} -142 ${sd * 84} -134 L${sd * 26} -84Z" fill="${C.mCap}" stroke="${C.ink}" stroke-width="${SW}" stroke-linejoin="round"/>`;
    s += `<path d="M${sd * 90} -48 L${sd * 90} -112 L${sd * 50} -82Z" fill="${C.earIn}"/>`;
  }
  const head = `<ellipse cx="0" cy="0" rx="112" ry="92"/>` + circ([[-104, 24, 30], [104, 24, 30], [-82, 58, 30], [82, 58, 30], [-42, 80, 30], [0, 86, 32], [42, 80, 30]]);
  s += blob(head, C.mF);
  s += `<clipPath id="${id}">${head}</clipPath><g clip-path="url(#${id})"><path d="M-140 -130 H140 V-36 Q104 -58 62 -46 Q26 -38 10 -14 Q0 -2 -10 -14 Q-26 -38 -62 -46 Q-104 -58 -140 -36Z" fill="${C.mCap}"/><path d="M-50 -74 q10 -12 22 -2 M18 -80 q12 -10 22 0" stroke="${C.mCap2}" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;
  // 볼 털결
  s += `<path d="M-118 34 l-14 6 M-100 66 l-12 10 M118 34 l14 6 M100 66 l12 10" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
  s += `<ellipse cx="-70" cy="44" rx="17" ry="10" fill="${C.blush}" opacity="${o.blush ? .95 : .5}"/><ellipse cx="70" cy="44" rx="17" ry="10" fill="${C.blush}" opacity="${o.blush ? .95 : .5}"/>`;
  const ex = 46, ey = 14, lk = o.look ?? (eyes === 'side' ? -9 : 0);
  const eye = (x, lid) => {
    let e = `<ellipse cx="${x}" cy="${ey}" rx="22" ry="24" fill="${C.iris}" stroke="${C.ink}" stroke-width="4"/>` +
      `<ellipse cx="${x + lk}" cy="${ey + 2}" rx="10" ry="16" fill="${C.ink}"/><circle cx="${x + lk - 5}" cy="${ey - 6}" r="5" fill="#fff"/>`;
    if (lid) {
      const sl = x < 0 ? 5 : -5;
      e += `<path d="M${x - 28} ${ey - 30} H${x + 28} V${ey - 1 - sl} L${x - 28} ${ey - 1 + sl}Z" fill="${C.mF}"/>` +
        `<path d="M${x - 25} ${ey + sl} L${x + 25} ${ey - sl}" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
    }
    return e;
  };
  if (eyes === 'smug' || eyes === 'side') s += eye(-ex, true) + eye(ex, true);
  else if (eyes === 'wide') s += eye(-ex, false) + eye(ex, false);
  else if (eyes === 'happy') s += `<path d="M${-ex - 16} ${ey + 7} Q${-ex} ${ey - 16} ${-ex + 16} ${ey + 7} M${ex - 16} ${ey + 7} Q${ex} ${ey - 16} ${ex + 16} ${ey + 7}" fill="none" stroke="${C.ink}" stroke-width="6.5" stroke-linecap="round"/>`;
  else if (eyes === 'closed') s += `<path d="M${-ex - 18} ${ey + 2} Q${-ex} ${ey + 8} ${-ex + 18} ${ey + 2} M${ex - 18} ${ey + 2} Q${ex} ${ey + 8} ${ex + 18} ${ey + 2}" fill="none" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
  // 코·입
  s += `<path d="M-10 40 Q0 36 10 40 L0 49Z" fill="${C.mNose}" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>`;
  if (mouth === 'flat') s += `<path d="M0 49 V54 M-11 58 H11" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
  else if (mouth === 'open') s += `<path d="M0 49 V53 M-14 54 Q-7 60 0 53 Q7 60 14 54" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/><path d="M-8 58 Q0 74 8 58Z" fill="#5b2a22" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>`;
  else s += `<path d="M0 49 V53 M-14 54 Q-7 62 0 53 Q7 62 14 54" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
  // 수염
  for (const sd of [-1, 1]) s += `<path d="M${sd * 70} 40 l${sd * 52} -8 M${sd * 72} 52 l${sd * 54} 2 M${sd * 70} 64 l${sd * 48} 12" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" opacity=".45"/>`;
  return s;
}
// pose: sit | phone | cheer
function milk(pose = 'sit', o = {}) {
  let s = '';
  s += blob(circ([[90, -34, 26], [122, -66, 26], [138, -106, 24], [132, -144, 20], [114, -168, 15]]), C.mCap);
  s += blob(circ([[-54, -92, 48], [54, -92, 48], [0, -116, 54], [-52, -46, 44], [52, -46, 44], [0, -40, 50], [-76, -64, 28], [76, -64, 28]]), C.mF);
  s += `<path d="M-28 -118 q10 12 0 24 M26 -116 q-10 12 0 24" stroke="${C.z200}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  s += blob(ell([[-30, -14, 26, 16], [30, -14, 26, 16]]), C.mF);

    const first = rank === 1;
    in_ += `<circle cx="${x0 + 26}" cy="${y + 24}" r="26" fill="${first ? C.a500 : C.z100}"/>`;
    in_ += first ? crown(x0 + 26, y + 23, 30, C.white, 2.4) : T(x0 + 26, y + 35, String(rank), { size: 28, weight: 800, fill: C.z700, anchor: 'middle' });
    in_ += T(x0 + 70, y + 36, d, { size: 32, weight: 800 });
    if (first) {
      const cx = x0 + 70 + tw(d, 32, 800) + 14, cw = tw('현재 1위', 24, 700) + 28;
      in_ += `<rect x="${cx}" y="${y + 6}" width="${cw}" height="40" rx="20" fill="${C.a50}"/>` + T(cx + cw / 2, y + 34, '현재 1위', { size: 24, weight: 700, fill: C.a700, anchor: 'middle' });
    }
    in_ += T(x1, y + 36, `${n}명`, { size: 30, weight: 700, fill: first ? C.ink : C.z500, anchor: 'end' });
    const bw = x1 - x0;
    in_ += `<rect x="${x0}" y="${y + 68}" width="${bw}" height="20" rx="10" fill="${C.z100}"/><rect x="${x0}" y="${y + 68}" width="${bw * n / 4}" height="20" rx="10" fill="${first ? C.a300 : C.z300}"/>`;
  });
  s += phone(px, py, pw, ph, in_);
  // 밀크: 그날 간다
  s += place(236, PB - 30, 1.05, milk('sit', { eyes: 'smug', mouth: 'w', blush: true, tilt: 4 }));
  s += nbox(PX + 36, PT + 36, '다음 날 아침');
  s += bubble(236, PT + 350, ['…좋아.', '그날 간다.'], { x: 246, y: PB - 420 }, { size: 44 });
  s += place(760, PB - 30, 0.62, choco('cheer', { eyes: 'happy', mouth: 'grin' }));
  s += sparkle(600, PB - 200, 14) + sparkle(920, PB - 230, 16);
  s += caption('실시간 순위로 한눈에, 1위엔 왕관', '누가 언제 되는지 다시 물어볼 필요 없어요');
  return s;
});

// 8 — 해피엔딩 + CTA (확정 = amber 단색)
S.push(() => {
  let s = chrome(8);
  const P1 = 790;
  s += panel(PT, P1, { stroke: C.a300, ring: C.a200 });
  s += `<clipPath id="p8"><rect x="${PX + 2}" y="${PT + 2}" width="${PW - 4}" height="${P1 - PT - 4}" rx="42"/></clipPath>`;
  // 확정 칩
  const lab = '6/20 (토) 확정!', lw = tw(lab, 34, 800) + 64 + 40;
  s += `<rect x="${W / 2 - lw / 2}" y="${PT + 44}" width="${lw}" height="72" rx="36" fill="${C.a500}"/>` + crown(W / 2 - lw / 2 + 52, PT + 79, 34, C.white, 2.4) + T(W / 2 - lw / 2 + 82, PT + 92, lab, { size: 34, weight: 800, fill: C.white });
  // 장면
  let sc = '';
  const TY = 620;
  sc += avatar('kong', 190, TY - 56, 52) + avatar('dubu', 890, TY - 56, 52);
  sc += place(405, TY + 50, 0.8, choco('cheer', { eyes: 'happy', mouth: 'tongue' }));
  sc += place(680, TY + 50, 0.8, milk('cheer', { eyes: 'happy', mouth: 'open', blush: true }));
  // 테이블 + 컵
  sc += `<rect x="${PX - 10}" y="${TY}" width="${PW + 20}" height="200" fill="${C.white}"/><path d="M${PX} ${TY} H${PX + PW}" stroke="${C.ink}" stroke-width="5"/>`;
  [[290], [542], [790]].forEach(([x], i) => {
    sc += `<path d="M${x - 24} ${TY - 62} L${x - 18} ${TY - 2} H${x + 18} L${x + 24} ${TY - 62}Z" fill="${C.white}" stroke="${C.ink}" stroke-width="4.5" stroke-linejoin="round"/><path d="M${x - 21} ${TY - 40} H${x + 21}" stroke="${C.z300}" stroke-width="4"/>`;
  });
  sc += T(W / 2, TY + 80, '드디어 만났다!', { size: 40, weight: 800, anchor: 'middle' });
  s += `<g clip-path="url(#p8)">${sc}</g>`;
  s += sparkle(170, PT + 200, 16) + sparkle(915, PT + 190, 18) + sparkle(860, PT + 290, 10) + sparkle(230, PT + 300, 10);
  // CTA
  s += T(W / 2, 916, '링크 하나로 1분 컷', { size: 72, weight: 800, anchor: 'middle', ls: -1.5 });
  const uw = tw('moilga.com', 48, 800) + 110;
  s += `<rect x="${W / 2 - uw / 2}" y="966" width="${uw}" height="104" rx="52" fill="${C.ink}"/>` + T(W / 2, 1035, 'moilga.com', { size: 48, weight: 800, fill: C.white, anchor: 'middle' });
  s += T(W / 2, 1140, '가입 없음 · 닉네임만 · 무료', { size: 36, weight: 700, fill: C.z700, anchor: 'middle' });
  s += T(W / 2, 1270, '프로필 링크에서 바로 시작해요', { size: 32, weight: 600, fill: C.z400, anchor: 'middle' });
  return s;
});

(async () => {
  await Promise.all([500, 600, 700, 800].map((w) => document.fonts.load(`${w} 40px Pretendard`, '모일까가')));
  await document.fonts.ready;
  const only = new URLSearchParams(location.search).get('s');
  S.forEach((fn, i) => {
    if (only && Number(only) !== i + 1) return;
    document.body.insertAdjacentHTML('beforeend', `<svg class="slide" id="s${i + 1}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${fn()}</svg>`);
  });
  window.READY = true;
})();
