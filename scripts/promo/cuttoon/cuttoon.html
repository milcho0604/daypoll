<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모일까 컷툰 EP.1</title>
<style>
  @font-face { font-family: Pretendard; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 600; src: url(fonts/Pretendard-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format('woff2'); }
  html, body { margin: 0; background: #d4d4d8; }
  body { display: flex; flex-direction: column; gap: 40px; padding: 40px; align-items: flex-start; }
  svg.slide { display: block; width: 1080px; height: 1350px; flex: none; }
  svg text { font-family: Pretendard, sans-serif; }
</style>
<script src="chars.js"></script>
</head>
<body>
<script>
// =====================================================================
// 모일까 컷툰 EP.1 — 8장 (1080×1350). 렌더: node render.mjs
// 캐릭터: chars.js 의 젤리 초코·밀크. 레이아웃: 가운데 정렬 헤드라인 + 형광펜 강조 + 실제 앱 UI 카드.
// 앱 UI 안의 1위/확정 표시는 CLAUDE.md 토큰 그대로(amber 단색, 🏆 없음).
// =====================================================================
const C = {
  ink: '#18181b', z700: '#3f3f46', z500: '#71717a', z400: '#a1a1aa', z300: '#d4d4d8', z200: '#e4e4e7', z100: '#f4f4f5',
  bg: '#f7f6f3', white: '#ffffff', mark: '#fde68a',
  a500: '#f59e0b', a300: '#fcd34d', a200: '#fde68a', a50: '#fffbeb', a700: '#b45309', rose500: '#f43f5e',
};
const W = 1080, H = 1350, M = 72;

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cvs = document.createElement('canvas').getContext('2d');
function tw(str, size, weight = 700, ls = 0) { cvs.font = `${weight} ${size}px Pretendard`; return cvs.measureText(str).width + ls * str.length; }
function T(x, y, str, { size = 40, weight = 700, fill = C.ink, anchor = 'start', ls = -0.3 } = {}) {
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${ls}">${esc(str)}</text>`;
}
const place = (x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
const DEFS = `<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#18181b" flood-opacity=".09"/></filter>
  <filter id="shs" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#18181b" flood-opacity=".1"/></filter></defs>`;
const crown = (cx, cy, size, color = C.white, sw = 2.3) =>
  `<g transform="translate(${cx - size / 2} ${cy - size / 2}) scale(${size / 24})" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5 3 6.8l4.7 3.4L12 4.5l4.3 5.7L21 6.8l-1 10.7z"/><path d="M4.4 20.2h15.2"/></g>`;
const mark = (x, y, s) => `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s * 0.28}" fill="${C.ink}"/>` + T(x + s / 2, y + s * 0.72, '모', { size: s * 0.58, weight: 800, fill: C.white, anchor: 'middle', ls: 0 });
const calIcon = (x, y, s, stroke) =>
  `<g transform="translate(${x} ${y}) scale(${s / 24})" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>`;

// ---------- 헤드라인: 가운데 정렬, [대괄호] 부분에 형광펜 ----------
function headline(lines, y0, { size = 78, lh = 100 } = {}) {
  let s = '';
  lines.forEach((line, i) => {
    const segs = line.split(/(\[[^\]]+\])/).filter(Boolean).map((t) => ({ t: t.replace(/[\[\]]/g, ''), hl: t.startsWith('[') }));
    const ls = -2.4, total = segs.reduce((a, g) => a + tw(g.t, size, 800, ls), 0);
    let x = W / 2 - total / 2;
    const y = y0 + i * lh;
    segs.forEach((g) => {
      const w = tw(g.t, size, 800, ls);
      if (g.hl) s += `<rect x="${x - 6}" y="${y - size * 0.34}" width="${w + 10}" height="${size * 0.42}" fill="${C.mark}"/>`;
      s += T(x, y, g.t.replace(/ /g, '\u00a0'), { size, weight: 800, ls });
      x += w;
    });
  });
  return s;
}
const sub = (y, str) => T(W / 2, y, str, { size: 34, weight: 600, fill: C.z500, anchor: 'middle' });
function pill(y, str) {
  const w = tw(str, 30, 800) + 64;
  return `<rect x="${W / 2 - w / 2}" y="${y}" width="${w}" height="64" rx="32" fill="${C.ink}"/>` + T(W / 2, y + 43, str, { size: 30, weight: 800, fill: C.a300, anchor: 'middle' });
}
function chrome(n) {
  return `<rect width="${W}" height="${H}" fill="${C.bg}"/>` + DEFS + mascotDefs() + mark(M, 54, 42) + T(M + 56, 86, '모일까', { size: 27, weight: 800 }) +
    T(W - M, 86, `${n} / 8`, { size: 26, weight: 600, fill: C.z400, anchor: 'end', ls: 0.5 });
}
const card = (x, y, w, h, inner = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="44" fill="${C.white}" filter="url(#sh)"/>` + inner;

// ---------- 젤리 아바타 / 채팅 ----------
const WHO = { choco: ['choco', '초코'], milk: ['milk', '밀크'], kong: ['kong', '콩이'], dubu: ['dubu', '두부'] };
function avatar(who, cx, cy, r, face = 'dot') {
  const id = 'av' + Math.random().toString(36).slice(2, 8);
  return `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.z100}"/>` +
    `<g clip-path="url(#${id})">${place(cx, cy - mascotFaceY[who] * (r / 100) + r * 0.12, r / 100, mascot(WHO[who][0], { face }))}</g>`;
}
function msgL(x, y, who, text, { size = 32, name = true, fill = C.z100 } = {}) {
  const r = 30, bx = x + r * 2 + 16;
  let s = avatar(who, x + r, y + r + (name ? 4 : 0), r), ty = y;
  if (name) { s += T(bx + 2, y + 22, WHO[who][1], { size: 24, weight: 600, fill: C.z400 }); ty = y + 32; }
  const w = tw(text, size, 600) + 46, h = size + 34;
  s += `<rect x="${bx}" y="${ty}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}"/>` + T(bx + 23, ty + h / 2 + size * 0.35, text, { size, weight: 600 });
  return { svg: s, h: ty - y + h };
}
const sysPill = (cx, y, text) => { const w = tw(text, 24, 600) + 36; return `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="44" rx="22" fill="${C.z100}"/>` + T(cx, y + 30, text, { size: 24, weight: 600, fill: C.z500, anchor: 'middle' }); };
function say(cx, y, lines, tail = 'down', { size = 34 } = {}) {
  const lh = size * 1.34, w = Math.max(...lines.map((l) => tw(l, size, 700))) + 56, h = lines.length * lh + 30, x = cx - w / 2;
  const tp = tail === 'dl' ? `M${x + 44} ${y + h - 2} L${x + 30} ${y + h + 20} L${x + 70} ${y + h - 2}Z` : tail === 'dr' ? `M${x + w - 70} ${y + h - 2} L${x + w - 30} ${y + h + 20} L${x + w - 44} ${y + h - 2}Z` : `M${cx - 12} ${y + h - 2} L${cx} ${y + h + 18} L${cx + 12} ${y + h - 2}Z`;
  let s = `<g filter="url(#shs)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(28, h / 2)}" fill="${C.white}"/><path d="${tp}" fill="${C.white}"/></g>`;
  lines.forEach((l, i) => { s += T(cx, y + 15 + size * 0.95 + i * lh, l, { size, weight: 700, anchor: 'middle' }); });
  return s;
}

// =====================================================================
const S = [];

// 1 — 표지
S.push(() => {
  let s = chrome(1);
  s += pill(170, '모일까 컷툰 EP.1');
  s += headline(['약속 잡기, 왜 맨날', '[흐지부지]될까?'], 340);
  s += sub(500, '단톡방에서 날짜 맞추다 지친 우리 얘기');
  // 바닥 무대
  s += `<ellipse cx="${W / 2}" cy="1170" rx="480" ry="84" fill="#efece6"/>`;
  s += place(318, 1160, 0.966, mascot('choco', { face: 'dot', tongue: true }));
  s += place(775, 1170, 0.898, mascot('milk', { face: 'side' }));
  s += say(300, 650, ['언제 볼래?'], 'dr') + say(800, 680, ['다음에 보자~'], 'dl');
  s += T(W / 2, 1290, '옆으로 넘겨 보기 →', { size: 28, weight: 600, fill: C.z400, anchor: 'middle' });
  return s;
});

// 2 — 3주 뒤
S.push(() => {
  let s = chrome(2);
  s += headline(['“언제 한번 보자~”', '[3주째] 조용한 단톡방'], 230, { size: 70, lh: 92 });
  const x = 150, y = 420, w = 780, h = 600;
  let in_ = T(x + 44, y + 76, '고딩 친구들', { size: 34, weight: 800 }) + T(x + 44 + tw('고딩 친구들 ', 34, 800), y + 76, '4', { size: 34, weight: 700, fill: C.z400 });
  in_ += `<path d="M${x} ${y + 112} H${x + w}" stroke="${C.z100}" stroke-width="3"/>`;
  let yy = y + 150;
  let r = msgL(x + 44, yy, 'choco', '우리 언제 한번 보자~'); in_ += r.svg; yy += r.h + 24;
  r = msgL(x + 44, yy, 'kong', '좋아좋아!!'); in_ += r.svg; yy += r.h + 44;
  in_ += sysPill(x + w / 2, yy, '3주 후');
  in_ += T(x + w / 2, yy + 140, '· · ·', { size: 44, weight: 800, fill: C.z300, anchor: 'middle', ls: 6 });
  s += card(x, y, w, h, in_);
  s += place(800, 1268, 0.72, mascot('choco', { face: 'flat' }));
  s += say(560, 1110, ['…?'], 'dr');
  return s;
});

// 3 — 날짜 지옥
S.push(() => {
  let s = chrome(3);
  s += headline(['날짜 하나 정하는 데', '[벌써 3일째]'], 230, { size: 74, lh: 96 });
  const x = 120, y = 410, w = 840, h = 560;
  let in_ = '', yy = y + 56;
  [['kong', '나 15일만 돼', 0], ['dubu', '난 그날 안 됨 ㅠ', 300], ['kong', '주말은??', 40], ['dubu', '다음 주는 어때', 260]].forEach(([who, t, dx]) => { const r = msgL(x + 50 + dx, yy, who, t, { name: false }); in_ += r.svg; yy += r.h + 26; });
  in_ += T(x + w - 50, y + h - 50, '읽음 4 · 답장 0', { size: 26, weight: 700, fill: C.z400, anchor: 'end' });
  s += card(x, y, w, h, in_);
  s += place(300, 1268, 0.72, mascot('choco', { face: 'squint' }));
  s += place(660, 1268, 0.72, mascot('milk', { face: 'side' }));
  s += say(880, 1040, ['또 시작이네'], 'dl');
  return s;
});

// 4 — 모일까
S.push(() => {
  let s = chrome(4);
  s += pill(170, '그래서 찾은 방법');
  s += headline(['이럴 땐', '[모일까]'], 340);
  s += sub(500, '친구들이랑 모일 날, 가입 없이 링크 하나로');
  const mw = 120, gap = 26, tx = tw('모일까', 96, 800), tot = mw + gap + tx, x0 = W / 2 - tot / 2;
  s += card(150, 590, 780, 260, mark(x0, 660, mw) + T(x0 + mw + gap, 660 + mw * 0.79, '모일까', { size: 96, weight: 800, ls: -2 }));
  s += `<ellipse cx="${W / 2}" cy="1180" rx="420" ry="70" fill="#efece6"/>`;
  s += place(360, 1172, 0.86, mascot('choco', { face: 'happy', tongue: true }));
  s += place(740, 1178, 0.84, mascot('milk', { face: 'wow' }));
  s += say(170, 880, ['이거다!'], 'dr');
  return s;
});

// 5 — 방 만들기
S.push(() => {
  let s = chrome(5);
  s += headline(['가입 없이', '[날짜만 콕콕]'], 230);
  s += sub(388, '회원가입도, 앱 설치도 없어요');
  const x = 150, y = 450, w = 780, h = 640;
  const lx = x + 50, cw = w - 100;
  let in_ = T(lx, y + 82, '방 만들기', { size: 38, weight: 800 });
  in_ += `<rect x="${lx}" y="${y + 116}" width="${cw}" height="70" rx="18" fill="${C.z100}"/>` + T(lx + 24, y + 162, '초코네 번개', { size: 30, weight: 700 });
  in_ += T(lx, y + 240, '가능한 날짜 · 2026년 6월', { size: 26, weight: 600, fill: C.z400 });
  const gy = y + 262, col = cw / 7, sel = new Set([13, 20, 21, 27]);
  ['일', '월', '화', '수', '목', '금', '토'].forEach((d, i) => { in_ += T(lx + col * (i + .5), gy + 34, d, { size: 24, weight: 600, fill: C.z400, anchor: 'middle' }); });
  for (let d = 1; d <= 30; d++) {
    const c = d % 7, r = Math.floor(d / 7), cx = lx + col * (c + .5), cy = gy + 88 + r * 64;
    if (sel.has(d)) in_ += `<circle cx="${cx}" cy="${cy - 9}" r="27" fill="${C.ink}"/>`;
    in_ += T(cx, cy, String(d), { size: 27, weight: sel.has(d) ? 800 : 600, fill: sel.has(d) ? C.white : C.z700, anchor: 'middle', ls: 0 });
  }
  s += card(x, y, w, h, in_);
  s += place(830, 1270, 0.544, mascot('choco', { face: 'happy', tongue: true }));
  s += say(520, 1150, ['닉네임만 쓰면 끝!'], 'dr');
  return s;
});

// 6 — 링크 하나
S.push(() => {
  let s = chrome(6);
  s += headline(['단톡방에 링크', '[하나면 끝]'], 230);
  s += sub(388, '카톡용 문구까지 알아서 만들어 줘요');
  const x = 150, y = 450, w = 780, h = 610;
  let in_ = T(x + 44, y + 76, '고딩 친구들', { size: 34, weight: 800 }) + `<path d="M${x} ${y + 112} H${x + w}" stroke="${C.z100}" stroke-width="3"/>`;
  const lw = 520, lx = x + w - 44 - lw, ly = y + 146, lh = 236;
  in_ += `<rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="28" fill="${C.ink}"/>` + calIcon(lx + 30, ly + 30, 36, C.white);
  in_ += T(lx + 80, ly + 60, '우리 언제 모일까?', { size: 32, weight: 800, fill: C.white });
  in_ += T(lx + 30, ly + 116, '가입 X · 가능한 날만 체크하면 끝', { size: 26, weight: 600, fill: C.z300 });
  in_ += T(lx + 30, ly + 152, '(1분 컷)', { size: 26, weight: 600, fill: C.z300 });
  in_ += `<rect x="${lx + 24}" y="${ly + 172}" width="${lw - 48}" height="44" rx="12" fill="${C.z700}"/>` + T(lx + 44, ly + 202, 'moilga.com/rooms/…', { size: 24, weight: 700, fill: C.white, ls: 0 });
  let yy = ly + lh + 36;
  let r = msgL(x + 44, yy, 'kong', '오 편하다'); in_ += r.svg; yy += r.h + 22;
  r = msgL(x + 44, yy, 'dubu', '체크 완료!'); in_ += r.svg;
  s += card(x, y, w, h, in_);
  s += place(830, 1270, 0.53, mascot('milk', { face: 'side' }));
  s += say(520, 1150, ['(몰래) 나도 체크함'], 'dr', { size: 30 });
  return s;
});

// 7 — 실시간 순위 (앱 UI의 1위 = amber 단색)
S.push(() => {
  let s = chrome(7);
  s += headline(['누가 언제 되는지', '[한눈에]'], 230);
  s += sub(388, '실시간 순위로, 1위엔 왕관');
  const x = 150, y = 450, w = 780, h = 640;
  const x0 = x + 50, x1 = x + w - 50;
  let in_ = T(x0, y + 80, '초코네 번개', { size: 38, weight: 800 }) + T(x1, y + 80, '응답 4/4', { size: 26, weight: 700, fill: C.z400, anchor: 'end' });
  ['choco', 'milk', 'kong', 'dubu'].forEach((who, i) => { in_ += avatar(who, x0 + 40 + i * 92, y + 148, 38, who === 'milk' ? 'side' : 'happy'); });
  [['6/20 (토)', 4, 1], ['6/27 (토)', 2, 2], ['6/21 (일)', 1, 3]].forEach(([d, n, rank], i) => {
    const ry = y + 236 + i * 128, first = rank === 1;
    in_ += `<circle cx="${x0 + 26}" cy="${ry + 22}" r="26" fill="${first ? C.a500 : C.z100}"/>`;
    in_ += first ? crown(x0 + 26, ry + 21, 30, C.white) : T(x0 + 26, ry + 33, String(rank), { size: 26, weight: 800, fill: C.z500, anchor: 'middle', ls: 0 });
    in_ += T(x0 + 70, ry + 34, d, { size: 34, weight: 800 });
    if (first) { const cx = x0 + 70 + tw(d, 34, 800) + 14, cw = tw('현재 1위', 24, 700) + 28; in_ += `<rect x="${cx}" y="${ry + 4}" width="${cw}" height="40" rx="20" fill="${C.a50}"/>` + T(cx + cw / 2, ry + 32, '현재 1위', { size: 24, weight: 700, fill: C.a700, anchor: 'middle' }); }
    in_ += T(x1, ry + 34, `${n}표`, { size: 30, weight: 700, fill: first ? C.ink : C.z400, anchor: 'end' });
    in_ += `<rect x="${x0}" y="${ry + 66}" width="${x1 - x0}" height="16" rx="8" fill="${C.z100}"/><rect x="${x0}" y="${ry + 66}" width="${(x1 - x0) * n / 4}" height="16" rx="8" fill="${first ? C.a300 : C.z300}"/>`;
  });
  s += card(x, y, w, h, in_);
  s += place(250, 1270, 0.53, mascot('milk', { face: 'side' }));
  s += say(560, 1150, ['…좋아. 그날 간다.'], 'dl', { size: 30 });
  return s;
});

// 8 — CTA
S.push(() => {
  let s = chrome(8);
  s += pill(170, '6/20 (토) 확정!');
  s += headline(['링크 하나로', '[1분 컷]'], 340);
  s += sub(500, '가입 없음 · 닉네임만 · 무료');
  s += `<ellipse cx="${W / 2}" cy="1010" rx="470" ry="80" fill="#efece6"/>`;
  s += place(175, 996, 0.56, mascot('kong', { face: 'happy' }));
  s += place(400, 1004, 0.68, mascot('choco', { face: 'happy', tongue: true, pose: 'cheer' }));
  s += place(690, 1008, 0.66, mascot('milk', { face: 'happy', pose: 'cheer' }));
  s += place(915, 996, 0.56, mascot('dubu', { face: 'wow' }));
  s += say(W / 2, 640, ['드디어 만났다!'], 'down', { size: 38 });
  const uw = tw('moilga.com', 46, 800) + 120;
  s += `<rect x="${W / 2 - uw / 2}" y="1120" width="${uw}" height="104" rx="52" fill="${C.ink}"/>` + T(W / 2, 1189, 'moilga.com', { size: 46, weight: 800, fill: C.white, anchor: 'middle', ls: 0 });
  s += T(W / 2, 1290, '프로필 링크에서 바로 시작해요', { size: 28, weight: 600, fill: C.z400, anchor: 'middle' });
  return s;
});

(async () => {
  await Promise.all([500, 600, 700, 800].map((w) => document.fonts.load(`${w} 40px Pretendard`, '모일까가')));
  await document.fonts.ready;
  const only = new URLSearchParams(location.search).get('s');
  S.forEach((fn, i) => {
    if (only && Number(only) !== i + 1) return;
    document.body.insertAdjacentHTML('beforeend', `<svg class="slide" id="s${i + 1}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${fn()}</svg>`);
  });
  window.READY = true;
})();
</script>
</body>
</html>
