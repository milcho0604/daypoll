<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모일까 컷툰 EP.1</title>
<style>
  @font-face { font-family: Pretendard; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 600; src: url(fonts/Pretendard-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format('woff2'); }
  html, body { margin: 0; background: #d4d4d8; }
  body { display: flex; flex-direction: column; gap: 40px; padding: 40px; align-items: flex-start; }
  svg.slide { display: block; width: 1080px; height: 1350px; flex: none; }
  svg text { font-family: Pretendard, sans-serif; }
</style>
</head>
<body>
<script>
// =====================================================================
// 모일까 컷툰 EP.1 — 8장 (1080×1350). 렌더: node render.mjs
// 아트 디렉션: 외곽선 없는 플랫 도형 + 점 눈, 왼쪽 정렬 헤드라인, 넓은 여백.
// 브랜드: zinc 베이스 + amber 는 1위(7장)/확정(8장)에만, 단색. 그라데이션·🏆 금지.
// =====================================================================
const C = {
  ink: '#18181b', z700: '#3f3f46', z500: '#71717a', z400: '#a1a1aa', z300: '#d4d4d8', z200: '#e4e4e7', z100: '#f4f4f5',
  bg: '#fafaf9', white: '#ffffff', card: '#efebe5', cardDeep: '#e6e1d9',
  a500: '#f59e0b', a300: '#fcd34d', a200: '#fde68a', a50: '#fffbeb', a700: '#b45309', rose500: '#f43f5e',
  // 초코 — 레드브라운 토이푸들
  cF: '#b4673f', cEar: '#9a5432', cMz: '#cf9068', tongue: '#ee8f9f',
  // 밀크 — 흰 장모 + 머리 위 회색 모자
  mF: '#ffffff', mShade: '#f3f1ee', mCap: '#9f9fa8', nose: '#efa3b1',
  kong: '#d9c4a9', kongIn: '#c4a98a', dubu: '#ffffff',
};
const W = 1080, H = 1350, M = 72;
let UID = 0;

// ---------- 헬퍼 ----------
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cvs = document.createElement('canvas').getContext('2d');
function tw(str, size, weight = 700) { cvs.font = `${weight} ${size}px Pretendard`; return cvs.measureText(str).width; }
function T(x, y, str, { size = 40, weight = 700, fill = C.ink, anchor = 'start', ls = -0.3 } = {}) {
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${ls}">${esc(str)}</text>`;
}
const place = (x, y, s, inner, flip = false) => `<g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})">${inner}</g>`;
const DEFS = `<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#18181b" flood-opacity=".08"/></filter>
  <filter id="shs" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#18181b" flood-opacity=".08"/></filter>
</defs>`;
// 단색 왕관 (components/icons/crown.tsx 와 같은 path)
const crown = (cx, cy, size, color = C.white, sw = 2.3) =>
  `<g transform="translate(${cx - size / 2} ${cy - size / 2}) scale(${size / 24})" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5 3 6.8l4.7 3.4L12 4.5l4.3 5.7L21 6.8l-1 10.7z"/><path d="M4.4 20.2h15.2"/></g>`;
const mark = (x, y, s) => `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s * 0.28}" fill="${C.ink}"/>` + T(x + s / 2, y + s * 0.72, '모', { size: s * 0.58, weight: 800, fill: C.white, anchor: 'middle', ls: 0 });
const calIcon = (x, y, s, stroke) =>
  `<g transform="translate(${x} ${y}) scale(${s / 24})" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>`;

// ---------- 눈 ----------
// dot | happy | line | squint | wide | side(반쯤 감고 옆 보기) | closed
function eyes(type, ex, ey, { look = 0 } = {}) {
  const k = C.ink;
  const one = (x, sd) => {
    switch (type) {
      case 'happy': return `<path d="M${x - 12} ${ey + 4} Q${x} ${ey - 11} ${x + 12} ${ey + 4}" fill="none" stroke="${k}" stroke-width="5.5" stroke-linecap="round"/>`;
      case 'closed': return `<path d="M${x - 12} ${ey - 2} Q${x} ${ey + 9} ${x + 12} ${ey - 2}" fill="none" stroke="${k}" stroke-width="5" stroke-linecap="round"/>`;
      case 'line': return `<path d="M${x - 11} ${ey} H${x + 11}" stroke="${k}" stroke-width="5.5" stroke-linecap="round"/>`;
      case 'squint': return `<path d="M${x - 8 * sd} ${ey - 9} L${x + 6 * sd} ${ey} L${x - 8 * sd} ${ey + 9}" fill="none" stroke="${k}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
      case 'wide': return `<circle cx="${x + look}" cy="${ey}" r="10" fill="${k}"/><circle cx="${x + look - 3}" cy="${ey - 4}" r="3.2" fill="#fff"/>`;
      case 'side': return `<path d="M${x - 9 + look} ${ey + 1} A9 9 0 0 0 ${x + 9 + look} ${ey + 1}Z" fill="${k}"/><path d="M${x - 14} ${ey + 1 - sd * 1.5} L${x + 14} ${ey + 1 + sd * 1.5}" stroke="${k}" stroke-width="5" stroke-linecap="round"/>`;
      default: return `<circle cx="${x + look}" cy="${ey}" r="7.5" fill="${k}"/>`;
    }
  };
  return one(-ex, -1) + one(ex, 1);
}

// =====================================================================
// 초코 — 외곽선 없음. 구름 실루엣 머리 + 늘어진 귀 + 점 눈 + 작은 혀
// =====================================================================
function chocoHead(o = {}) {
  const e = o.eyes ?? 'dot';
  let s = '';
  for (const sd of [-1, 1]) s += `<ellipse cx="${sd * 84}" cy="22" rx="34" ry="66" transform="rotate(${sd * -12} ${sd * 84} 22)" fill="${C.cEar}"/>`;
  s += `<g fill="${C.cF}"><ellipse cx="0" cy="10" rx="88" ry="80"/><circle cx="-46" cy="-54" r="40"/><circle cx="0" cy="-72" r="44"/><circle cx="46" cy="-54" r="40"/><circle cx="-76" cy="-12" r="30"/><circle cx="76" cy="-12" r="30"/></g>`;
  s += `<ellipse cx="0" cy="44" rx="40" ry="30" fill="${C.cMz}"/>`;
  s += eyes(e, 34, 6, { look: o.look ?? 0 });
  s += `<ellipse cx="0" cy="30" rx="12" ry="9" fill="${C.ink}"/>`;
  if (o.tongue !== false) s += `<rect x="-8" y="46" width="16" height="22" rx="8" fill="${C.tongue}"/>`;
  return s;
}
const paw = (x, y, r, fill) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`;
const limb = (sx, sy, ang, len, w, fill) =>
  `<g transform="translate(${sx} ${sy}) rotate(${ang})"><rect x="${-w / 2}" y="${-len}" width="${w}" height="${len}" rx="${w / 2}" fill="${fill}"/></g>`;
// pose: stand | cheer | point | phone
function choco(pose = 'stand', o = {}) {
  let s = `<ellipse cx="0" cy="2" rx="86" ry="12" fill="#000" opacity=".07"/>`;
  s += paw(64, -116, 22, C.cEar);
  s += `<rect x="-46" y="-44" width="30" height="44" rx="15" fill="${C.cEar}"/><rect x="16" y="-44" width="30" height="44" rx="15" fill="${C.cEar}"/>`;
  s += `<ellipse cx="0" cy="-86" rx="68" ry="62" fill="${C.cF}"/>`;
  let front = '';
  if (pose === 'cheer') s += limb(-48, -108, -58, 118, 30, C.cF) + paw(-148, -170, 19, C.cF) + limb(48, -108, 58, 118, 30, C.cF) + paw(148, -170, 19, C.cF);
  else if (pose === 'point') { s += limb(-52, -104, 160, 52, 28, C.cF); front = limb(50, -112, 58, 96, 30, C.cF); }
  else if (pose === 'phone') front = `<rect x="-30" y="-140" width="60" height="88" rx="14" fill="${C.ink}"/><rect x="-24" y="-132" width="48" height="66" rx="8" fill="${C.z700}"/>` + paw(-32, -80, 17, C.cF) + paw(32, -80, 17, C.cF);
  else s += limb(-54, -100, 168, 54, 28, C.cF) + limb(54, -100, -168, 54, 28, C.cF);
  s += `<g transform="translate(0 -226)${o.tilt ? ` rotate(${o.tilt})` : ''}">${chocoHead(o)}</g>`;
  return s + front;
}

// =====================================================================
// 밀크 — 흰 몸 + 회색 귀·모자·꼬리, 점 눈 / 반쯤 감은 새침 눈
// =====================================================================
function milkHead(o = {}) {
  const e = o.eyes ?? 'side';
  const id = 'mh' + (UID++);
  let s = '';
  for (const sd of [-1, 1]) s += `<path d="M${sd * 90} -34 L${sd * 82} -112 L${sd * 30} -78Z" fill="${C.mCap}" stroke="${C.mCap}" stroke-width="18" stroke-linejoin="round"/>`;
  const head = `<ellipse cx="0" cy="0" rx="100" ry="84"/><circle cx="-80" cy="30" r="34"/><circle cx="80" cy="30" r="34"/><circle cx="0" cy="58" r="44"/>`;
  s += `<g fill="${C.mF}">${head}</g>`;
  s += `<clipPath id="${id}">${head}</clipPath><path clip-path="url(#${id})" d="M-140 -110 H140 V-40 Q92 -58 46 -42 Q18 -32 6 -10 Q-6 -34 -40 -46 Q-96 -64 -140 -22Z" fill="${C.mCap}"/>`;
  s += eyes(e, 38, 14, { look: o.look ?? (e === 'side' ? -4 : 0) });
  s += `<path d="M-8 32 H8 L0 41Z" fill="${C.nose}" stroke="${C.nose}" stroke-width="5" stroke-linejoin="round"/>`;
  if (o.mouth !== 'none') s += `<path d="M-12 48 Q-6 54 0 48 Q6 54 12 48" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round"/>`;
  for (const sd of [-1, 1]) s += `<path d="M${sd * 64} 36 l${sd * 40} -6 M${sd * 64} 48 l${sd * 40} 4" stroke="${C.z300}" stroke-width="3" stroke-linecap="round"/>`;
  if (o.blush) s += `<ellipse cx="-66" cy="44" rx="14" ry="8" fill="#f6b6c0" opacity=".7"/><ellipse cx="66" cy="44" rx="14" ry="8" fill="#f6b6c0" opacity=".7"/>`;
  return s;
}
// pose: sit | cheer | phone
function milk(pose = 'sit', o = {}) {
  let s = `<ellipse cx="0" cy="2" rx="92" ry="12" fill="#000" opacity=".07"/>`;
  s += `<path d="M58 -30 C128 -36 140 -110 112 -150" fill="none" stroke="${C.mCap}" stroke-width="26" stroke-linecap="round"/>`;
  s += `<ellipse cx="0" cy="-82" rx="74" ry="66" fill="${C.mF}"/><ellipse cx="0" cy="-40" rx="62" ry="28" fill="${C.mShade}"/>`;
  s += `<rect x="-46" y="-40" width="30" height="40" rx="15" fill="${C.mF}"/><rect x="16" y="-40" width="30" height="40" rx="15" fill="${C.mF}"/>`;
  let front = '';
  if (pose === 'cheer') s += limb(-50, -112, -58, 118, 30, C.mF) + paw(-150, -174, 19, C.mF) + limb(50, -112, 58, 118, 30, C.mF) + paw(150, -174, 19, C.mF);
  else if (pose === 'phone') front = `<g transform="rotate(-10 0 -100)"><rect x="-30" y="-146" width="60" height="88" rx="14" fill="${C.ink}"/><rect x="-24" y="-138" width="48" height="66" rx="8" fill="${C.z700}"/></g>` + paw(-34, -84, 17, C.mF) + paw(28, -90, 17, C.mF);
  s += `<g transform="translate(0 -232)${o.tilt ? ` rotate(${o.tilt})` : ''}">${milkHead(o)}</g>`;
  return s + front;
}

// 단톡방 친구 — 동그란 플랫 얼굴
function avatar(kind, cx, cy, r) {
  const k = r / 30;
  if (kind === 'choco') return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.card}"/><g transform="translate(${cx} ${cy + r * 0.12}) scale(${r / 150})">${chocoHead({ eyes: 'dot' })}</g>`;
  if (kind === 'milk') return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.card}"/><g transform="translate(${cx} ${cy + r * 0.16}) scale(${r / 150})">${milkHead({ eyes: 'side' })}</g>`;
  let s = `<g transform="translate(${cx} ${cy}) scale(${k})">`;
  if (kind === 'kong') s += `<circle r="30" fill="${C.card}"/><circle cx="-14" cy="-12" r="7" fill="${C.kongIn}"/><circle cx="14" cy="-12" r="7" fill="${C.kongIn}"/><circle cy="4" r="18" fill="${C.kong}"/>`;
  else s += `<circle r="30" fill="${C.card}"/><rect x="-11" y="-28" width="8" height="22" rx="4" fill="${C.dubu}"/><rect x="3" y="-28" width="8" height="22" rx="4" fill="${C.dubu}"/><circle cy="5" r="17" fill="${C.dubu}"/>`;
  s += `<circle cx="-6" cy="4" r="2.4" fill="${C.ink}"/><circle cx="6" cy="4" r="2.4" fill="${C.ink}"/>`;
  return s + '</g>';
}
const NAMES = { choco: '초코', milk: '밀크', kong: '콩이', dubu: '두부' };

// ---------- 채팅 ----------
function msgL(x, y, who, text, { size = 32, name = true, dim = false } = {}) {
  const r = 28, bx = x + r * 2 + 14;
  let s = avatar(who, x + r, y + r + (name ? 6 : 2), r), ty = y;
  if (name) { s += T(bx + 2, y + 22, NAMES[who], { size: 24, weight: 600, fill: C.z400 }); ty = y + 32; }
  const w = tw(text, size, 600) + 44, h = size + 32;
  s += `<rect x="${bx}" y="${ty}" width="${w}" height="${h}" rx="${h / 2}" fill="${C.z100}"/>` + T(bx + 22, ty + h / 2 + size * 0.35, text, { size, weight: 600, fill: dim ? C.z400 : C.ink });
  return { svg: s, h: ty - y + h };
}
function msgR(x1, y, text, { size = 32 } = {}) {
  const w = tw(text, size, 600) + 44, h = size + 32;
  return { svg: `<rect x="${x1 - w}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${C.ink}"/>` + T(x1 - w + 22, y + h / 2 + size * 0.35, text, { size, weight: 600, fill: C.white }), h };
}
const sysPill = (cx, y, text) => { const w = tw(text, 24, 600) + 36; return `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="44" rx="22" fill="${C.z100}"/>` + T(cx, y + 30, text, { size: 24, weight: 600, fill: C.z500, anchor: 'middle' }); };
// 흰 카드(앱 화면/채팅창) — 얕은 그림자
const sheet = (x, y, w, h, inner, title) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="34" fill="${C.white}" filter="url(#sh)"/>` +
  (title ? T(x + 36, y + 62, title, { size: 28, weight: 800 }) + `<path d="M${x} ${y + 92} H${x + w}" stroke="${C.z100}" stroke-width="3"/>` : '') + inner;
// 캐릭터 말풍선 — 흰 둥근 사각 + 작은 꼬리, 외곽선 없음
function say(cx, y, lines, tail, { size = 34 } = {}) {
  const lh = size * 1.34, w = Math.max(...lines.map((l) => tw(l, size, 700))) + 56, h = lines.length * lh + 30;
  const x = cx - w / 2;
  let tailP = '';
  if (tail === 'down') tailP = `<path d="M${cx - 12} ${y + h - 2} L${cx} ${y + h + 18} L${cx + 12} ${y + h - 2}Z" fill="${C.white}"/>`;
  else if (tail === 'dl') tailP = `<path d="M${x + 40} ${y + h - 2} L${x + 30} ${y + h + 20} L${x + 64} ${y + h - 2}Z" fill="${C.white}"/>`;
  else if (tail === 'dr') tailP = `<path d="M${x + w - 64} ${y + h - 2} L${x + w - 30} ${y + h + 20} L${x + w - 40} ${y + h - 2}Z" fill="${C.white}"/>`;
  let s = `<g filter="url(#shs)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(28, h / 2)}" fill="${C.white}"/>${tailP}</g>`;
  lines.forEach((l, i) => { s += T(cx, y + 15 + size * 0.95 + i * lh, l, { size, weight: 700, anchor: 'middle' }); });
  return s;
}

// =====================================================================
// 레이아웃: 헤더 / 왼쪽 정렬 헤드라인 / 장면 카드
// =====================================================================
const CX0 = M, CX1 = W - M, CY0 = 486, CY1 = H - M, CW = CX1 - CX0;
const GND = CY1 - 64; // 캐릭터 바닥선
function chrome(n) {
  return `<rect width="${W}" height="${H}" fill="${C.bg}"/>` + DEFS + mark(M, 56, 44) + T(M + 58, 89, '모일까', { size: 28, weight: 800 }) +
    T(W - M, 89, `${String(n).padStart(2, '0')} / 08`, { size: 26, weight: 600, fill: C.z400, anchor: 'end', ls: 0.5 });
}
function head(kicker, l1, l2, sub) {
  let s = T(M, 206, kicker, { size: 28, weight: 700, fill: C.z400, ls: 0.2 });
  s += T(M, 288, l1, { size: 62, weight: 800, ls: -1.6 });
  if (l2) s += T(M, 366, l2, { size: 62, weight: 800, ls: -1.6 });
  if (sub) s += T(M, 430, sub, { size: 30, weight: 600, fill: C.z500 });
  return s;
}
const card = (fill = C.card, extra = '') => `<rect x="${CX0}" y="${CY0}" width="${CW}" height="${CY1 - CY0}" rx="44" fill="${fill}" ${extra}/>`;
const cardClip = (id) => `<clipPath id="${id}"><rect x="${CX0}" y="${CY0}" width="${CW}" height="${CY1 - CY0}" rx="44"/></clipPath>`;

// =====================================================================
// 슬라이드
// =====================================================================
const S = [];

// 1 — 표지
S.push(() => {
  let s = chrome(1);
  const tag = '모일까 컷툰 EP.1', tgw = tw(tag, 26, 700) + 40;
  s += `<rect x="${M}" y="168" width="${tgw}" height="52" rx="26" fill="${C.z100}"/>` + T(M + 20, 203, tag, { size: 26, weight: 700, fill: C.z700 });
  s += T(M, 318, '약속 잡기, 왜 맨날', { size: 76, weight: 800, ls: -2.2 });
  s += T(M, 410, '흐지부지될까?', { size: 76, weight: 800, ls: -2.2 });
  s += T(M, 474, '단톡방에서 날짜 맞추다 지친 우리 얘기', { size: 30, weight: 600, fill: C.z500 });
  const y0 = 560;
  s += `<rect x="${CX0}" y="${y0}" width="${CW}" height="${CY1 - y0}" rx="44" fill="${C.card}"/>`;
  s += msgL(CX0 + 56, y0 + 70, 'kong', '언제 한번 보자~', { name: false }).svg;
  s += msgR(CX1 - 56, y0 + 160, '다음에 보자!').svg;
  s += msgL(CX0 + 56, y0 + 250, 'dubu', '그래그래 ㅋㅋ', { name: false, dim: true }).svg;
  s += place(400, GND, 0.95, choco('stand', { eyes: 'dot', tilt: -4 }));
  s += place(690, GND, 0.92, milk('sit', { eyes: 'side', look: -5 }));
  s += T(CX1 - 40, CY1 - 36, '넘겨 보기 →', { size: 26, weight: 600, fill: C.z400, anchor: 'end' });
  return s;
});

// 2 — 3주 뒤
S.push(() => {
  let s = chrome(2);
  s += head('#1  단톡방', '“언제 한번 보자~”', '그리고 3주가 지났다');
  s += card();
  const sx = CX0 + 48, sy = CY0 + 48, sw = 560, sh = 520;
  let in_ = '';
  let y = sy + 124;
  let r = msgL(sx + 32, y, 'choco', '우리 언제 한번 보자~'); in_ += r.svg; y += r.h + 22;
  r = msgL(sx + 32, y, 'kong', '좋아좋아!!'); in_ += r.svg; y += r.h + 40;
  in_ += sysPill(sx + sw / 2, y, '3주 후');
  in_ += T(sx + sw / 2, y + 140, '. . .', { size: 40, weight: 800, fill: C.z300, anchor: 'middle', ls: 4 });
  s += sheet(sx, sy, sw, sh, in_, '고딩 친구들 4');
  s += place(800, GND, 0.95, choco('phone', { eyes: 'line', tongue: false }));
  s += say(800, CY0 + 300, ['…?'], 'down');
  return s;
});

// 3 — 날짜 지옥
S.push(() => {
  let s = chrome(3);
  s += head('#2  날짜 정하기', '날짜 하나 정하는 데', '벌써 3일째');
  s += card();
  const L = CX0 + 56;
  let y = CY0 + 56;
  const rows = [['kong', '나 15일만 돼', 0], ['dubu', '난 그날 안 됨 ㅠ', 300], ['kong', '주말은??', 40], ['dubu', '다음 주는 어때', 260]];
  rows.forEach(([who, t, dx]) => { const r = msgL(L + dx, y, who, t, { name: false }); s += r.svg.replace(new RegExp(`fill="${C.z100}"`, 'g'), `fill="${C.white}"`); y += r.h + 22; });
  s += T(CX1 - 56, CY0 + 256, '(읽씹 4명)', { size: 28, weight: 600, fill: C.z400, anchor: 'end' });
