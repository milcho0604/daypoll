<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f7f6f3}</style><script src="../chars.js"></script></head><body>
<svg id="s" width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const g = (x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
let out = `<rect width="1400" height="900" fill="#f7f6f3"/>` + mascotDefs();
const faces = ['dot', 'happy', 'side', 'squint', 'wow', 'sleepy'];
faces.forEach((f, i) => out += g(120 + i * 232, 400, 0.62, mascot('choco', { face: f, tongue: f === 'happy' || f === 'dot', pose: i === 4 ? 'cheer' : '' })));
faces.forEach((f, i) => out += g(120 + i * 232, 760, 0.62, mascot('milk', { face: f, pose: i === 4 ? 'cheer' : '' })));
out += g(1310, 140, 0.5, mascot('kong', { face: 'happy' })) + g(1310, 860, 0.5, mascot('dubu', {}));
document.getElementById('s').innerHTML = out;
window.READY = true;
</script></body></html>
