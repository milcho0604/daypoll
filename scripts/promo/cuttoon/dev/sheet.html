<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: P; font-weight: 800; src: url(../fonts/Pretendard-ExtraBold.woff2); }
body{margin:0;background:#fafaf9}</style><script src="../chars.js"></script></head><body>
<svg id="s" width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const g = (x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
let out = `<rect width="1400" height="760" fill="#f4f3f0"/>`;
const faces = ['dot', 'happy', 'side', 'squint', 'wow', 'sleepy'];
faces.forEach((f, i) => out += g(130 + i * 228, 330, 0.62, jelly('choco', { face: f, lean: [-0.6,0.5,-0.3,0.7,0,-0.5][i], tongue: f === 'happy' })));
faces.forEach((f, i) => out += g(130 + i * 228, 680, 0.62, jelly('milk', { face: f, lean: [0.6,-0.5,0.4,-0.7,0,0.5][i] })));
document.getElementById('s').innerHTML = out;
window.READY = true;
</script></body></html>
