<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>푸들의 탄생 신화</title>
<!--
  푸들의 탄생 신화 — 1080×1920, 30fps, 60초 세로 영상.
  모든 움직임은 window.seek(t) 한 번으로 결정된다 (결정론적 렌더).
  render.mjs 가 프레임마다 seek → 스크린샷 → ffmpeg 로 인코딩.

  ===== STYLE GUIDE =====
  종이: cream #F4EBD9 (+ 종이 결 노이즈, 비네트, 이중 테두리 프레임)
  팔레트: ink #3A2E2A · terracotta #D0735A · mustard #E3AA4A · sage #8EA88A · teal #5E8C94 · night #2F3654
  캐릭터 털: apricot #F0CFA6 / 그늘 #DDB083
  선: 캐릭터 외곽선 6px ink, round join. 세부 3~4px.
  캐릭터: poodle('natural' | 'clip') — 모든 장면에서 같은 함수로 그린 같은 개.
-->
<style>
  @font-face { font-family: Pretendard; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 600; src: url(fonts/Pretendard-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format('woff2'); }
  @font-face { font-family: Pretendard; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format('woff2'); }
  :root { --paper:#F4EBD9; --ink:#3A2E2A; --terra:#D0735A; --mustard:#E3AA4A; --sage:#8EA88A; --teal:#5E8C94; --night:#2F3654; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  body { font-family: Pretendard, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .scene > svg { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
  svg text { font-family: Pretendard, sans-serif; }

  /* 챕터 라벨 (장면마다) */
  .chap { position: absolute; top: 132px; left: 0; right: 0; display: flex; justify-content: center; }
  .chap .in {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 20px 44px 22px; border-radius: 28px;
    background: rgba(255,249,236,.92); border: 3px solid var(--ink);
    box-shadow: 0 8px 0 rgba(58,46,42,.18);
  }
  .chap small { font-size: 30px; font-weight: 700; color: var(--terra); letter-spacing: .02em; }
  .chap b { font-size: 50px; font-weight: 800; }

  /* 인트로 타이틀 */
  .title { position: absolute; top: 250px; left: 0; right: 0; text-align: center; }
  .title small { display: block; font-size: 44px; font-weight: 700; color: var(--terra); letter-spacing: .08em; }
  .title h1 { margin-top: 10px; font-size: 128px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
  .title .rule { margin: 26px auto 0; width: 360px; height: 18px; display: flex; align-items: center; gap: 14px; }
  .title .rule i { flex: 1; height: 3px; background: var(--ink); border-radius: 3px; }
  .title .rule em { width: 16px; height: 16px; transform: rotate(45deg); background: var(--mustard); border: 3px solid var(--ink); }

  /* 엔딩 */
  .endtext { position: absolute; top: 930px; left: 0; right: 0; text-align: center; }
  .endtext h2 { font-size: 86px; font-weight: 800; line-height: 1.3; }
  .endtext h2 .l { display: block; }
  .endtext p { margin-top: 34px; font-size: 40px; font-weight: 700; color: var(--terra); letter-spacing: .1em; }

  /* 오버레이: 종이 결 + 비네트 + 책 테두리 */
  #grain { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .16; pointer-events: none; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 60% at 50% 45%, transparent 55%, rgba(58,46,42,.22) 100%); }
  #frame { position: absolute; inset: 34px; border: 4px solid rgba(58,46,42,.55); border-radius: 30px; pointer-events: none; }
  #frame::after { content: ''; position: absolute; inset: 10px; border: 2px solid rgba(58,46,42,.3); border-radius: 22px; }

  /* 자막 */
  #cap { position: absolute; left: 80px; right: 80px; bottom: 250px; display: flex; justify-content: center; pointer-events: none; }
  #cap .plate {
    max-width: 920px; padding: 30px 44px 34px; border-radius: 34px;
    background: rgba(255,249,236,.94); border: 3px solid rgba(58,46,42,.85);
    box-shadow: 0 10px 0 rgba(58,46,42,.16), 0 24px 50px -20px rgba(0,0,0,.35);
    text-align: center;
  }
  #cap .line { display: block; font-size: 58px; font-weight: 700; line-height: 1.42; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <svg width="0" height="0" style="position:absolute"><defs><radialGradient id="glowM"><stop offset="0" stop-color="#E3AA4A" stop-opacity=".42"/><stop offset=".55" stop-color="#E3AA4A" stop-opacity=".16"/><stop offset="1" stop-color="#E3AA4A" stop-opacity="0"/></radialGradient><linearGradient id="nightFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4368" stop-opacity="0"/><stop offset=".6" stop-color="#3A4368" stop-opacity=".7"/></linearGradient><radialGradient id="glowC"><stop offset="0" stop-color="#FFF8EA" stop-opacity=".35"/><stop offset="1" stop-color="#FFF8EA" stop-opacity="0"/></radialGradient></defs></svg>
  <svg id="grain" width="1080" height="1920"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#gf)"/></svg>
  <div id="vig"></div>
  <div id="frame"></div>
  <div id="cap"><div class="plate"></div></div>
</div>

<script>
// ================= 스타일 가이드 (공통 상수) =================
const C = {
  paper: '#F4EBD9', ink: '#3A2E2A', terra: '#D0735A', mustard: '#E3AA4A', sage: '#8EA88A', teal: '#5E8C94', night: '#2F3654',
  fur: '#F0CFA6', fur2: '#DDB083', cream: '#FFF8EA', skin: '#EDC09C', soil: '#8C6246',
};
const SW = 6;

// ---------- 그리기 헬퍼 ----------
const circ = (arr) => arr.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
// 겹친 도형들의 "합집합 외곽선" — 먼저 굵은 ink, 위에 fill (내부 선이 안 보임)
function blob(shapes, fill, sw = SW, attrs = '') {
  return `<g ${attrs}><g fill="${C.ink}" stroke="${C.ink}" stroke-width="${sw * 2}" stroke-linejoin="round">${shapes}</g><g fill="${fill}">${shapes}</g></g>`;
}
// Catmull-Rom → cubic bezier
function spline(pts, closed = true) {
  const n = pts.length;
  let d = `M${pts[0]}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1.map((v) => v.toFixed(1))} ${c2.map((v) => v.toFixed(1))} ${p2}`;
  }
  return d + (closed ? 'Z' : '');
}
const curls = (arr, op = 0.35) => arr.map(([x, y, r = 9, rot = 0]) =>
  `<path d="M${x - r} ${y} a${r} ${r} 0 1 1 ${r * 1.4} ${r * 0.8}" transform="rotate(${rot} ${x} ${y})" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round" opacity="${op}"/>`).join('');
// 반짝이 (4갈래 별)
const sparkle = (x, y, s, fill, p = 0, sp = 0.6) =>
  `<g data-anim="twinkle" data-cx="${x}" data-cy="${y}" data-p="${p}" data-s="${sp}"><path d="M${x} ${y - s} Q${x + s * .18} ${y - s * .18} ${x + s} ${y} Q${x + s * .18} ${y + s * .18} ${x} ${y + s} Q${x - s * .18} ${y + s * .18} ${x - s} ${y} Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z" fill="${fill}"/></g>`;
const heart = (s = 1, fill = C.terra) =>
  `<path transform="scale(${s})" d="M0 12 C-26 -6 -22 -30 -6 -30 C0 -30 0 -24 0 -22 C0 -24 0 -30 6 -30 C22 -30 26 -6 0 12Z" fill="${fill}" stroke="${C.ink}" stroke-width="${4 / s}" stroke-linejoin="round"/>`;
const paw = (x, y, s = 1, rot = 0, fill = C.ink, extra = '') =>
  `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" ${extra}><ellipse cx="0" cy="8" rx="15" ry="12" fill="${fill}"/>${circ([[-15, -10, 6.5], [-5, -18, 6.5], [6, -18, 6.5], [16, -10, 6.5]]).replaceAll('<circle', `<circle fill="${fill}"`)}</g>`;
const pine = (x, y, h, fill, stroke = 'none') => {
  const w = h * 0.42;
  return `<path d="M${x} ${y - h} L${x + w * .55} ${y - h * .55} L${x + w * .3} ${y - h * .55} L${x + w * .8} ${y - h * .18} L${x + w * .45} ${y - h * .18} L${x + w} ${y} L${x - w} ${y} L${x - w * .45} ${y - h * .18} L${x - w * .8} ${y - h * .18} L${x - w * .3} ${y - h * .55} L${x - w * .55} ${y - h * .55}Z" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>`;
};
const tufts = (y, fill, n, x0 = 60, x1 = 1020) => { let r = ''; for (let i = 0; i < n; i++) { const x = x0 + (x1 - x0) * (i + rnd() * .6) / n, yy = y + rnd() * 380, h = 34 + rnd() * 30; const d = `M${x - 6} ${yy} Q${x - 10} ${yy - h * .5} ${x - 26} ${yy - h} M${x} ${yy} Q${x} ${yy - h * .6} ${x + 2} ${yy - h * 1.25} M${x + 6} ${yy} Q${x + 12} ${yy - h * .5} ${x + 26} ${yy - h * .9}`; r += `<path d="${d}" fill="none" stroke="${C.ink}" stroke-width="12" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="5" stroke-linecap="round"/>`; } return r; };
// 결정론적 난수
let SEED = 7;
const rnd = () => ((SEED = (SEED * 16807) % 2147483647) / 2147483647);

// ================= 주인공: 푸들 =================
// 원점 = 발 아래 중앙, 오른쪽을 본다. 대략 x -205..255, y -375..0
function poodleHead(o) {
  const F = o.fur ?? C.fur, F2 = o.fur2 ?? C.fur2;
  let s = blob(circ([[150, -285, 50], [128, -335, 32], [158, -342, 32], [143, -368, 28], [112, -312, 28], [180, -320, 24]]) +
    `<rect x="168" y="-303" width="84" height="42" rx="21"/>`, F);
  s += curls([[132, -345, 9, 10], [158, -355, 8, 40], [118, -318, 8, -20], [150, -330, 7, 70]]);
  s += blob(circ([[122, -282, 24], [116, -252, 28], [114, -220, 27], [120, -194, 22]]), F2);
  s += curls([[114, -250, 8, 0], [116, -218, 8, 30]], 0.3);
  s += `<ellipse cx="202" cy="-270" rx="12" ry="7" fill="${C.terra}" opacity=".45"/>`;
  s += `<ellipse cx="182" cy="-298" rx="7" ry="9" fill="${C.ink}"/><circle cx="184.5" cy="-301.5" r="2.5" fill="#fff"/>`;
  s += `<ellipse cx="249" cy="-291" rx="12" ry="10.5" fill="${C.ink}"/>`;
  s += `<path d="M215 -268 q10 8 22 0" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`;
  if (o.ribbon) s += `<g transform="translate(140 -378) rotate(-14)" fill="${C.terra}" stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"><path d="M0 0 L-36 -20 L-34 20Z"/><path d="M0 0 L36 -20 L34 20Z"/><circle r="10"/></g>`;
  return s;
}
function poodle(v = 'natural', o = {}) {
  const F = o.fur ?? C.fur, F2 = o.fur2 ?? C.fur2;
  let s = '';
  const wag = (inner, px, py) => `<g data-anim="wag" data-cx="${px}" data-cy="${py}" data-a="${o.wag ?? 12}" data-s="${o.wagSpd ?? 1.6}">${inner}</g>`;
  if (v === 'natural') {
    s += blob(circ([[-70, -112, 26], [-70, -78, 26], [-70, -45, 26], [-66, -22, 24]]), F2);
    s += blob(circ([[100, -112, 26], [100, -78, 26], [100, -45, 26], [104, -22, 24]]), F2);
    s += wag(blob(circ([[-150, -200, 20], [-163, -228, 24], [-173, -258, 26], [-176, -286, 22]]), F), -140, -185);
    s += blob(circ([[-110, -170, 52], [-60, -186, 58], [0, -189, 60], [55, -183, 58], [95, -190, 52], [-115, -140, 42], [95, -146, 44], [-40, -140, 50], [30, -140, 50], [125, -212, 46],
      [-105, -112, 27], [-105, -78, 27], [-105, -45, 27], [-100, -22, 25], [70, -112, 27], [70, -78, 27], [70, -45, 27], [75, -22, 25]]), F);
    s += curls([[-100, -175], [-40, -200, 10, 30], [20, -175, 9, -20], [70, -200, 10, 50], [-60, -150, 8, 80], [40, -145, 8, 10], [-104, -70, 8], [70, -70, 8, 40]]);
  } else {
    const leg = (x, fill) => blob(`<rect x="${x - 12}" y="-165" width="24" height="160" rx="12"/>` + `<ellipse cx="${x + 5}" cy="-8" rx="21" ry="10"/>`, fill) +
      blob(circ([[x, -48, 28], [x - 12, -64, 17], [x + 12, -64, 17]]), fill) + curls([[x - 4, -48, 8, 20]], .3);
    s += leg(-70, F2) + leg(100, F2);
    s += wag(`<path d="M-142 -188 L-166 -250" stroke="${C.ink}" stroke-width="24" stroke-linecap="round"/><path d="M-142 -188 L-166 -250" stroke="${F}" stroke-width="12" stroke-linecap="round"/>` +
      blob(circ([[-170, -266, 30], [-158, -286, 18], [-184, -284, 18]]), F) + curls([[-170, -266, 10, 30]]), -145, -190);
    s += blob(`<ellipse cx="-45" cy="-178" rx="108" ry="42"/><rect x="-117" y="-190" width="24" height="185" rx="12"/><ellipse cx="-100" cy="-8" rx="21" ry="10"/>`, F);
    s += blob(circ([[-105, -48, 28], [-117, -64, 17], [-93, -64, 17]]), F) + curls([[-108, -48, 8, 20]], .3);
    s += blob(circ([[-100, -184, 31], [-86, -200, 18], [-114, -200, 18]]), F) + curls([[-100, -184, 10, 0]]);
    s += leg(70, F);
    s += blob(circ([[35, -178, 48], [80, -195, 60], [115, -170, 48], [70, -142, 46], [120, -220, 48], [90, -238, 48], [30, -208, 40], [140, -192, 40]]), F);
    s += curls([[60, -200, 10, 20], [100, -170, 9, -30], [40, -165, 9, 60], [110, -230, 9, 0], [80, -150, 8, 40]]);
  }
  const head = `<g data-anim="wag" data-cx="125" data-cy="-230" data-a="${o.nod ?? 2.5}" data-s="${o.nodSpd ?? 0.45}" data-p="1">${poodleHead(o)}</g>`;
  s += o.headRot ? `<g transform="rotate(${o.headRot} 125 -230)">${head}</g>` : head;
  return s;
}
const place = (x, y, sc, inner, flip = false) => `<g transform="translate(${x} ${y}) scale(${flip ? -sc : sc} ${sc})">${inner}</g>`;

// ================= 늑대 =================
function wolf(fill = '#6F7690') {
  const body = spline([[-208, -92], [-178, -140], [-135, -170], [-60, -180], [20, -184], [80, -198], [112, -226], [126, -262], [132, -300], [148, -326], [148, -326], [162, -286], [180, -274],
    [216, -262], [250, -250], [244, -233], [206, -228], [170, -212], [150, -180], [132, -120], [126, -60], [132, -4], [132, -4], [104, -4], [104, -4], [98, -70], [86, -118],
    [20, -122], [-60, -120], [-84, -100], [-78, -50], [-72, -4], [-72, -4], [-100, -4], [-100, -4], [-110, -60], [-128, -108], [-150, -132], [-186, -110]]);
  return `<rect x="-55" y="-118" width="24" height="114" rx="12" fill="#555B72" stroke="${C.ink}" stroke-width="${SW}"/>` +
    `<rect x="62" y="-125" width="24" height="121" rx="12" fill="#555B72" stroke="${C.ink}" stroke-width="${SW}"/>` +
    `<path d="${body}" fill="${fill}" stroke="${C.ink}" stroke-width="${SW}" stroke-linejoin="round"/>` +
    `<path d="M-120 -150 Q-60 -160 20 -160" fill="none" stroke="#8C93AA" stroke-width="5" stroke-linecap="round" opacity=".7"/>` +
    `<circle cx="198" cy="-258" r="6" fill="${C.cream}"/><circle cx="249" cy="-246" r="8" fill="${C.ink}"/>` +
    `<path d="M146 -312 L155 -288" stroke="${C.ink}" stroke-width="4" stroke-linecap="round" opacity=".6"/>`;
}

// ================= 장면 =================
const SC = [];
function scene({ id, t0, t1, trans = 'fade', iris, zoom = [1, 1.07], focus = [540, 900], pan = [[-30, 0], [30, 0]], panFn, chap, svg, html = '' }) {
  SC.push({ id, t0, t1, trans, iris, zoom, focus, pan, panFn, chap, svg, html });
}
// 레이어: depth 0 = 고정 원경, 1 = 카메라와 같이, >1 = 전경 (빠르게)
const L = (depth, inner) => `<g class="layer" data-depth="${depth}">${inner}</g>`;

// ---------- S1 인트로 ----------
SEED = 11;
scene({
  id: 's1', t0: 0, t1: 6.5, zoom: [1.0, 1.06], focus: [540, 960], pan: [[0, 10], [0, -10]],
  svg: () => {
    let stars = '';
    for (let i = 0; i < 22; i++) stars += sparkle(100 + rnd() * 880, 560 + rnd() * 900, 8 + rnd() * 12, i % 3 ? C.mustard : C.terra, rnd() * 6, 0.4 + rnd() * .5);
    let leaves = '';
    for (let i = 0; i < 18; i++) {
      const side = i < 9 ? -1 : 1, k = (i % 9) / 8;
      const ang = (side < 0 ? 200 - k * 150 : -20 + k * 150) * Math.PI / 180;
      const x = 540 + Math.cos(ang) * 318, y = 960 + Math.sin(ang) * 318;
      const rot = ang * 180 / Math.PI + (side < 0 ? -60 : 60);
      leaves += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="26" ry="11" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${C.sage}" stroke="${C.ink}" stroke-width="4"/>`;
    }
    let motes = '';
    for (let i = 0; i < 16; i++) motes += `<g data-anim="rise" data-r="700" data-s="${0.08 + rnd() * .08}" data-p="${rnd()}"><circle cx="${120 + rnd() * 840}" cy="${1500 + rnd() * 200}" r="${4 + rnd() * 5}" fill="${C.mustard}" opacity=".7"/></g>`;
    return L(0, `<rect x="-200" y="-200" width="1480" height="2320" fill="${C.paper}"/><circle cx="540" cy="960" r="640" fill="url(#glowM)" opacity=".7"/>`) +
      L(0.3, stars + motes) +
      L(0.6, `<circle cx="540" cy="960" r="304" fill="none" stroke="${C.mustard}" stroke-width="8" stroke-dasharray="2 22" stroke-linecap="round"/>` + leaves +
        `<circle cx="540" cy="960" r="280" fill="${C.cream}" stroke="${C.ink}" stroke-width="7"/>` +
        `<ellipse cx="540" cy="1140" rx="190" ry="22" fill="${C.ink}" opacity=".12"/>` +
        place(517, 1134, 0.95, poodle('clip', { ribbon: true, wag: 14 })) +
        sparkle(760, 780, 22, C.mustard, 0, .5) + sparkle(330, 820, 16, C.terra, 2, .6));
  },
  html: `<div class="title"><small>옛날 옛적 이야기</small><h1>푸들의<br>탄생 신화</h1><div class="rule"><i></i><em></em><i></i></div></div>`,
});

// ---------- S2 늑대 ----------
SEED = 21;
scene({
  id: 's2', t0: 6.5, t1: 14, trans: 'iris', iris: [540, 960], zoom: [1.04, 1.12], focus: [520, 1150], pan: [[-40, 0], [40, 0]],
  chap: ['첫 번째 이야기', '늑대의 시대'],
  svg: () => {
    let stars = '';
    for (let i = 0; i < 40; i++) stars += sparkle(-150 + rnd() * 1380, 380 + rnd() * 560, 4 + rnd() * 9, i % 5 ? C.cream : C.mustard, rnd() * 6, .3 + rnd() * .6);
    let far = '', near = '';
    for (let x = -260; x < 1360; x += 52 + rnd() * 30) far += pine(x, 1080 + rnd() * 30, 180 + rnd() * 120, '#2A3050');
    for (let x = -260; x < 1360; x += 70 + rnd() * 40) near += pine(x, 1170 + rnd() * 20, 240 + rnd() * 140, '#20253F');

// ================= 빌드 =================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x) => Math.max(0, Math.min(1, x));
function smoothstep(x) { x = clamp(x); return x * x * (3 - 2 * x); }
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, t) => a + (b - a) * t;
const frac = (x) => x - Math.floor(x);

const host = $('#scenes');
SC.forEach((s) => {
  const div = document.createElement('div');
  div.className = 'scene';
  div.id = s.id;
  div.innerHTML = `<svg viewBox="0 0 1080 1920" width="1080" height="1920"><g class="cam">${s.svg()}</g></svg>` +
    (s.chap ? `<div class="chap"><div class="in"><small>${s.chap[0]}</small><b>${s.chap[1]}</b></div></div>` : '') + s.html;
  host.appendChild(div);
  s.el = div;
  s.cam = $('.cam', div);
  s.layers = $$('.layer', div).map((el) => ({ el, d: +el.dataset.depth }));
  s.anims = $$('[data-anim]', div).map((el) => {
    const d = el.dataset;
    return { el, type: d.anim, a: +(d.a ?? 10), s: +(d.s ?? 1), p: +(d.p ?? 0), cx: +(d.cx ?? 0), cy: +(d.cy ?? 0), r: +(d.r ?? 300), dx: +(d.dx ?? 0), mod: d.mod ? +d.mod : 0 };
  });
  s.chapEl = $('.chap .in', div);
});

function runAnim(an, t) {
  const { el, type, a, s, p, cx, cy } = an;
  const w = Math.sin(2 * Math.PI * s * t + p);
  switch (type) {
    case 'wag': el.setAttribute('transform', `rotate(${(a * w).toFixed(2)} ${cx} ${cy})`); break;
    case 'bob': el.setAttribute('transform', `translate(0 ${(a * w).toFixed(2)})`); break;
    case 'twinkle': {
      const k = 0.5 + 0.5 * w;
      el.setAttribute('opacity', (0.3 + 0.7 * k).toFixed(3));
      const sc = 0.7 + 0.3 * k;
      el.setAttribute('transform', `translate(${cx} ${cy}) scale(${sc.toFixed(3)}) translate(${-cx} ${-cy})`);
      break;
    }
    case 'flicker': {
      const n = Math.sin(t * 11 + p) * 0.6 + Math.sin(t * 7.3 + p * 2) * 0.4;
      const m = Math.sin(t * 9.1 + p * 3);
      el.setAttribute('transform', `translate(${cx} ${cy}) scale(${(1 + a * m * .5).toFixed(3)} ${(1 + a * n).toFixed(3)}) translate(${-cx} ${-cy})`);
      break;
    }
    case 'ripple': {
      const k = frac(t * s + p);
      el.setAttribute('transform', `translate(${cx} ${cy}) scale(${(0.3 + k).toFixed(3)}) translate(${-cx} ${-cy})`);
      el.setAttribute('opacity', ((1 - k) * 0.8).toFixed(3));
      break;
    }
    case 'fall': {
      const k = frac(t * s + p);
      el.setAttribute('transform', `translate(${(a * Math.sin(t * 1.3 + p * 9)).toFixed(1)} ${(k * an.r).toFixed(1)}) rotate(${(Math.sin(t * 2 + p * 5) * 40).toFixed(1)})`);
      el.setAttribute('opacity', Math.min(1, Math.sin(Math.PI * k) * 3).toFixed(3));
      break;
    }
    case 'rise': {
      const k = frac(t * s + p);
      el.setAttribute('transform', `translate(${(a * Math.sin(t * 1.7 + p * 7)).toFixed(1)} ${(-k * an.r).toFixed(1)})`);
      el.setAttribute('opacity', Math.sin(Math.PI * k).toFixed(3));
      break;
    }
    case 'spin': el.setAttribute('transform', `rotate(${(360 * s * t).toFixed(2)} ${cx} ${cy})`); break;
    case 'slide': {
      let x = s * t;
      if (an.mod) x = ((x % an.mod) + an.mod) % an.mod - (s < 0 ? 0 : an.mod);
      el.setAttribute('transform', `translate(${x.toFixed(1)} 0)`);
      break;
    }
    case 'splash': {
      const k = frac(t * s + p);
      el.setAttribute('transform', `translate(${(an.dx * k).toFixed(1)} ${(-a * 4 * k * (1 - k) + 20 * k).toFixed(1)})`);
      el.setAttribute('opacity', (k < .85 ? 1 : (1 - k) / .15).toFixed(3));
      break;
    }
  }
}

// 등장 헬퍼: k(0..1) 로 opacity + 위로 살짝
function appear(el, k, dy = 30, scale = 1) {
  if (!el) return;
  const e = easeOut(k);
  el.style.opacity = e;
  el.style.transform = `translateY(${(1 - e) * dy}px) scale(${lerp(scale, 1, e)})`;
}
function appearSvg(el, k, cx, cy, from = 0.6) {
  const e = smoothstep(k);
  el.setAttribute('opacity', e.toFixed(3));
  const sc = lerp(from, 1, easeOut(k));
  el.setAttribute('transform', `translate(${cx} ${cy}) scale(${sc.toFixed(3)}) translate(${-cx} ${-cy})`);
}

const TR = 0.9; // 전환 길이
function sceneFrame(s, i, t) {
  const next = SC[i + 1];
  const visible = t >= s.t0 - 0.001 && t < (next ? next.t0 + TR : 1e9);
  s.el.style.display = visible ? 'block' : 'none';
  if (!visible) return;
  const tl = t - s.t0;
  const kin = clamp(tl / TR);
  s.el.style.opacity = 1;
  s.el.style.clipPath = 'none';
  if (i === 0) s.el.style.opacity = 1;
  else if (s.trans === 'fade') s.el.style.opacity = smoothstep(kin);
  else if (s.trans === 'iris' && kin < 1) s.el.style.clipPath = `circle(${(easeOut(kin) * 1350 + 1).toFixed(1)}px at ${s.iris[0]}px ${s.iris[1]}px)`;
  else if (s.trans === 'wipe' && kin < 1) s.el.style.clipPath = `inset(0 0 0 ${((1 - smoothstep(kin)) * 1080).toFixed(1)}px)`;
  // 카메라: Ken Burns (전환 구간 포함해 계속 움직이게)
  const dur = s.t1 - s.t0 + TR;
  const p = clamp(tl / dur);
  const z = lerp(s.zoom[0], s.zoom[1], smoothstep(p * 0.9 + 0.05));
  const [fx, fy] = s.focus;
  s.cam.setAttribute('transform', `translate(${fx} ${fy}) scale(${z.toFixed(4)}) translate(${-fx} ${-fy})`);
  const [px, py] = s.panFn ? s.panFn(tl) : [lerp(s.pan[0][0], s.pan[1][0], p), lerp(s.pan[0][1], s.pan[1][1], p)];
  s.layers.forEach(({ el, d }) => el.setAttribute('transform', `translate(${(px * d).toFixed(2)} ${(py * d).toFixed(2)})`));
  s.anims.forEach((an) => runAnim(an, tl));
  if (s.chapEl) {
    const kc = clamp((tl - 0.25) / 0.6);
    const ko = clamp((s.t1 - 0.3 - t) / 0.4);
    appear(s.chapEl, Math.min(kc, ko), -24);
  }
  SCENE_FX[s.id]?.(tl, t, s);
}

    const sy = 900 + Math.sin(tl * 5) * 160;

    $('#scissors').setAttribute('opacity', on.toFixed(3));
    $('#cutline').setAttribute('transform', `translate(${x.toFixed(1)} 0)`);
    $('#cutline').setAttribute('opacity', (on * 0.8).toFixed(3));
    $$('.fluff').forEach((f, i) => {
      const tb = 1.1 + i * 0.17, kk = clamp((tl - tb) / 1.2);
      const fx = lerp(220, 870, smoothstep((tb - 1.0) / 2.4));
      const fy = 950 + (i % 5) * 50 + kk * 260;
      f.setAttribute('transform', `translate(${(fx + Math.sin(kk * 6 + i) * 30).toFixed(1)} ${fy.toFixed(1)}) rotate(${(kk * 200).toFixed(0)})`);
      f.setAttribute('opacity', (kk > 0 ? Math.sin(Math.PI * kk) : 0).toFixed(3));
    });
    [['#lb1', 4.0, 255, 620], ['#lb2', 4.45, 880, 960], ['#lb3', 4.9, 255, 1310], ['#lb4', 5.35, 855, 1310]].forEach(([sel, t0, cx, cy]) =>
      appearSvg($(sel), (tl - t0) / 0.45, cx, cy, 0.7));
  },
  s5(tl) { appearSvg($('#banner'), (tl - 0.6) / 0.7, 540, 470, 0.5); },
  s7(tl) {
    const k = Math.sin(tl * 2 * Math.PI * 0.7);
    $('#arm').setAttribute('transform', `translate(${(k * 22).toFixed(1)} ${(k * -4 - 6).toFixed(1)}) `);
    const kin = easeOut((tl - 0.6) / 1.0);
    $('#arm').style.opacity = kin;
    $('#arm').setAttribute('transform', `translate(${(k * 22 + (1 - kin) * 400).toFixed(1)} ${(k * -4 + 72 - (1 - kin) * 60).toFixed(1)})`);
  },
  s8(tl) {
    [['#md1', 0.2, 200], ['#md2', 0.6, 540], ['#md3', 1.0, 880]].forEach(([sel, t0, cx]) => appearSvg($(sel), (tl - t0) / 0.5, cx, 560, 0.5));
    $$('.pw').forEach((p, i) => p.setAttribute('opacity', smoothstep((tl - 0.5 - (i >> 1) * 0.4 - (i % 2) * 0.15) / 0.2).toFixed(3)));
    const ls = $$('.endtext .l');
    appear(ls[0], (tl - 1.5) / 0.7, 40);
    appear(ls[1], (tl - 2.1) / 0.7, 40);
    appear($('.endtext p'), (tl - 2.8) / 0.6, 20);
    $('#endpaws').setAttribute('opacity', smoothstep((tl - 2.8) / 0.6).toFixed(3));
  },
};

// ---------- 자막 ----------
const plate = $('#cap .plate');
let capShown = null;
function captionFrame(t) {
  const c = CAPS.find(([a, b]) => t >= a - 0.001 && t < b + 0.35);
  if (!c) { $('#cap').style.opacity = 0; return; }
  if (capShown !== c) { plate.innerHTML = c[2].split('<br>').map((l) => `<span class="line">${l}</span>`).join(''); capShown = c; }
  const [a, b] = c;
  const kin = easeOut((t - a) / 0.45);
  const kout = clamp((b + 0.35 - t) / 0.35);
  const cap = $('#cap');
  cap.style.opacity = Math.min(smoothstep((t - a) / 0.3), kout);
  cap.style.transform = `translateY(${((1 - kin) * 26).toFixed(1)}px)`;
  $$('.line', plate).forEach((l, i) => {
    const k = easeOut((t - a - 0.12 - i * 0.2) / 0.45);
    l.style.opacity = k;
    l.style.transform = `translateY(${((1 - k) * 18).toFixed(1)}px)`;
  });
}

window.DURATION = 60;
window.seek = (t) => {
  SC.forEach((s, i) => sceneFrame(s, i, t));
  captionFrame(t);
};
window.seek(0);

if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = () => { window.seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
