# 로컬 개발용 DB. 운영 스택(docker-compose.prod.yml, 프로젝트 moilga)과
# 프로젝트명·컨테이너명을 분리해 같은 머신에서 동시에 떠도 충돌하지 않는다.
# scripts/dev.sh 가 `-p moilga-dev` 로 이 파일만 제어한다.
name: moilga-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: moilga-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whenever}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whenever}
      POSTGRES_DB: ${POSTGRES_DB:-whenever}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # named volume (운영 compose 와 동일한 방식). 이름이 compose 프로젝트명 기준
      # (moilga-dev_pgdata) 이라 **어느 디렉토리에서 띄우든 항상 같은 DB** 를 문다.
      #
      # 예전엔 bind mount `./pgdata` 였는데, `./` 가 compose 파일 위치 기준으로
      # 상대 해석되는 게 함정이었다 — git worktree 에서 띄우면 거기에 별도의 빈
      # DB 가 생기고, 그 worktree 를 지우면 컨테이너가 삭제된 경로를 문 채 좀비가 됐다.
      # macOS 는 bind mount I/O 가 느려서 DB 에 특히 불리한 것도 덤.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whenever} -d ${POSTGRES_DB:-whenever}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # 실제 이름은 moilga-dev_pgdata (프로젝트명 접두). 운영의 moilga_pgdata 와 별개.
  pgdata:
